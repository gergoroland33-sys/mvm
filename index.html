<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Családi Elszámolás - Narrative Pro</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
:root {
    --bg: #0f172a; --card: #1e293b; --primary: #3b82f6; --accent: #f59e0b;
    --text: #f8fafc; --dim: #94a3b8; --border: #334155; --success: #10b981;
    --danger: #ef4444;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Inter', sans-serif; }
body {
    background: var(--bg); color: var(--text); margin: 0; padding: 15px; padding-bottom: 120px;
}

/* HEADER & REFRESH */
.header-container { position: relative; margin-bottom: 25px; text-align: center; }
h1 { margin: 0; font-size: 1.6rem; font-weight: 900; background: linear-gradient(to right, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.subtitle { font-size: 0.8rem; color: var(--dim); margin-top: 5px; text-transform: uppercase; letter-spacing: 2px; font-weight: bold; }

.refresh-btn {
    position: absolute; top: 0; right: 0;
    background: rgba(255,255,255,0.05); border: 1px solid var(--border);
    color: var(--dim); width: 35px; height: 35px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 1.2rem; transition: all 0.3s ease;
}

/* KÁRTYÁK */
.card {
    background: var(--card); border: 1px solid var(--border); border-radius: 20px;
    padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}
.card-title {
    font-size: 0.9rem; font-weight: 700; color: var(--dim); text-transform: uppercase;
    margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; 
    border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;
}

/* PROGNÓZIS BOX (ÚJ) */
.prediction-box {
    background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%);
    border: 1px solid var(--primary); border-radius: 20px; padding: 20px; margin-bottom: 20px;
}
.pred-title { font-size: 0.75rem; color: var(--primary); font-weight: 800; text-transform: uppercase; margin-bottom: 10px; }
.pred-text { font-size: 0.9rem; line-height: 1.5; color: #e2e8f0; }
.hl-good { color: var(--success); font-weight: 800; }
.hl-bad { color: var(--danger); font-weight: 800; }
.hl-neutral { color: var(--accent); font-weight: 800; }

/* SZÖVEGES ELEMZÉS KÁRTYÁK (ÚJ) */
.narrative-card {
    background: rgba(255,255,255,0.03); border-radius: 12px; padding: 15px; margin-bottom: 15px;
    border-left: 4px solid var(--dim);
}
.narrative-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: 700; color: white; }
.narrative-body { font-size: 0.85rem; color: var(--dim); line-height: 1.5; }
.narrative-card.over-limit { border-left-color: var(--danger); }
.narrative-card.under-limit { border-left-color: var(--success); }

/* VILLANY ÁTALÁNY */
.highlight-row {
    background: rgba(59, 130, 246, 0.1); border: 1px solid var(--primary);
    border-radius: 12px; padding: 15px; margin-bottom: 20px;
}
.hl-label { font-size: 0.8rem; font-weight: 700; color: var(--primary); display: block; margin-bottom: 5px; text-transform: uppercase; }
.hl-input-group { display: flex; align-items: center; justify-content: space-between; }
.hl-input {
    background: transparent; border: none; color: white; font-size: 1.5rem; font-weight: 900;
    width: 120px; text-align: right; border-bottom: 2px solid transparent; transition: 0.3s;
}
.hl-input:not([readonly]) { border-bottom-color: var(--primary); background: rgba(0,0,0,0.2); }
.hl-hint { font-size: 0.8rem; color: var(--dim); margin-top: 5px; text-align: right; }

/* LISTA */
.expense-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0; border-bottom: 1px dashed rgba(255,255,255,0.1);
}
.ex-input {
    width: 90px; background: transparent; border: none; color: white;
    font-weight: 700; text-align: right; font-size: 1rem;
    border-bottom: 1px solid transparent; transition: 0.2s; padding: 5px 0; opacity: 0.8;
}
.ex-input:not([readonly]) { 
    border-bottom-color: var(--accent); color: var(--accent); opacity: 1; 
    background: rgba(255,255,255,0.05); border-radius: 4px; padding-right: 5px;
}

/* GOMBOK */
.fab-group { position: fixed; bottom: 20px; left: 0; right: 0; display: flex; justify-content: center; gap: 15px; z-index: 100; }
.btn { background: var(--card); border: 1px solid var(--border); color: white; padding: 12px 25px; border-radius: 50px; font-weight: 700; display: flex; align-items: center; gap: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); cursor: pointer; }
.btn-primary { background: var(--primary); border-color: var(--primary); box-shadow: 0 10px 30px rgba(59,130,246,0.4); }

/* ÖSSZESÍTÉS */
.total-box {
    background: linear-gradient(145deg, rgba(245, 158, 11, 0.1), rgba(15,23,42,0.8));
    border: 1px solid var(--accent); border-radius: 20px; padding: 25px; text-align: center;
}
.total-amount { font-size: 2.8rem; font-weight: 900; color: white; margin: 5px 0; text-shadow: 0 0 20px rgba(245, 158, 11, 0.3); }

/* INPUTOK */
.mvm-mini { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 12px; margin-bottom: 20px; }
.mvm-field label { display: block; font-size: 0.7rem; color: var(--dim); margin-bottom: 3px; }
.mvm-field input { width: 100%; background: transparent; border: 1px solid var(--border); color: white; padding: 8px; border-radius: 8px; font-weight: bold; text-align: center; }

/* PDF EXPORT MODE */
.pdf-export-mode { background: #ffffff !important; padding: 20px !important; color: #1e293b !important; }
.pdf-export-mode .card, .pdf-export-mode .prediction-box { background: #fff !important; border: 1px solid #ccc !important; box-shadow: none !important; color: black !important; }
.pdf-export-mode .narrative-card { background: #f8fafc !important; border: 1px solid #e2e8f0 !important; color: black !important; border-left-width: 4px !important; }
.pdf-export-mode .narrative-body { color: #334155 !important; }
.pdf-export-mode .total-box { background: #fffbeb !important; border-color: #f59e0b !important; color: black !important; }
.pdf-export-mode .total-amount { color: #b45309 !important; text-shadow: none !important; }
.pdf-export-mode .fab-group, .pdf-export-mode .edit-btn, .pdf-export-mode .refresh-btn { display: none !important; }

</style>
</head>
<body>

<div id="contentToShare">
    <div class="header-container">
        <div class="header">
            <h1>SZÖVEGES ELSZÁMOLÁS</h1>
            <div class="subtitle" id="currentMonthDate">2026. FEBRUÁR</div>
        </div>
        <button class="refresh-btn" onclick="location.reload()" title="Oldal frissítése">↻</button>
    </div>

    <div class="prediction-box">
        <div class="pred-title">⚡ Éves Keret Prognózis (8700 kWh)</div>
        <div class="pred-text" id="annualPredictionText">
            Adatok betöltése...
        </div>
    </div>

    <div class="card">
        <div class="card-title">
            <div class="title-left"><i>💰</i> HAVI FIX KÖLTSÉGEK</div>
            <button class="edit-btn" id="editBtn" onclick="toggleEdit()"><span>🔒 ZÁRVA</span></button>
        </div>

        <div class="highlight-row">
            <span class="hl-label">⚡ Villany (Átalány) - Teljes</span>
            <div class="hl-input-group">
                <span>Összeg:</span>
                <div>
                    <input type="number" id="villanyTotal" class="hl-input" value="55000" readonly oninput="saveInputs()">
                    <span style="font-weight:bold">Ft</span>
                </div>
            </div>
            <div class="hl-hint">Anyu része (50%): <strong id="villanyHalf" style="color:var(--primary)">27 500 Ft</strong></div>
        </div>

        <div id="expenseList"></div>
    </div>

    <div class="card">
        <div class="total-box">
            <div class="total-label">UTALANDÓ ÖSSZEG (ANYU)</div>
            <div class="total-amount" id="grandTotal">0 Ft</div>
            <div style="font-size:0.75rem; color:var(--dim); margin-top:5px;">(Fix költségek + Villany Átalány fele)</div>
        </div>
    </div>

    <div class="card">
        <div class="card-title">
            <div class="title-left"><i>📝</i> SZÖVEGES NAPLÓZÁS</div>
        </div>
        
        <div class="mvm-mini">
            <div class="mvm-field">
                <label>Utolsó mentett (17 232)</label>
                <input type="number" id="mvmPrev" readonly>
            </div>
            <div class="mvm-field">
                <label>Új óraállás</label>
                <input type="number" id="mvmCurr" placeholder="Leolvasás..." oninput="updateLiveNarrative()">
            </div>
        </div>

        <div id="narrativeContainer"></div>
    </div>
</div>

<div class="fab-group">
    <button class="btn" onclick="save()">💾 Mentés</button>
    <button class="btn btn-primary" onclick="sharePDF()">📤 PDF Jelentés</button>
</div>

<script>
// --- ALAPADATOK ---
const DEFAULT_ITEMS = [
    { id: 'tv', name: 'TV Előfizetés', val: 7142 },
    { id: 'tel', name: 'Telefon', val: 4500 },
    { id: 'net', name: 'Internet', val: 2880 },
    { id: 'viz', name: 'Vízdíj', val: 2500 },
    { id: 'bizt', name: 'Biztosítás', val: 2386 },
    { id: 'szemet', name: 'Szemét díj', val: 667 },
    { id: 'komm', name: 'Kommunális adó', val: 600 },
];
const MVM_LIMIT = 210; const P_REZSI = 36.386; const P_PIACI = 70.104;
const YEARLY_LIMIT = 8700;
const START_METER = 17232; // Fix kezdő érték

const now = new Date();
const monthNames = ["JANUÁR","FEBRUÁR","MÁRCIUS","ÁPRILIS","MÁJUS","JÚNIUS","JÚLIUS","AUGUSZTUS","SZEPTEMBER","OKTÓBER","NOVEMBER","DECEMBER"];
const currentMonthStr = `${now.getFullYear()}. ${monthNames[now.getMonth()]}`;
document.getElementById('currentMonthDate').innerText = currentMonthStr;

// INPUTOK BETÖLTÉSE
let savedInputs = JSON.parse(localStorage.getItem('expense_settings')) || {};
let villanyVal = savedInputs['villanyTotal'] || 55000;
document.getElementById('villanyTotal').value = villanyVal;

const listContainer = document.getElementById('expenseList');
DEFAULT_ITEMS.forEach(item => {
    let currentVal = savedInputs[item.id] !== undefined ? savedInputs[item.id] : item.val;
    const div = document.createElement('div');
    div.className = 'expense-item';
    div.innerHTML = `<span class="ex-name">${item.name}</span><div><input type="number" class="ex-input locked" id="inp_${item.id}" value="${currentVal}" readonly oninput="saveInputs()"><span style="font-size:0.8rem; color:#94a3b8">Ft</span></div>`;
    listContainer.appendChild(div);
});

// ZÁR GOMB LOGIKA
let isEditing = false;
function toggleEdit() {
    isEditing = !isEditing;
    const btn = document.getElementById('editBtn');
    const inputs = document.querySelectorAll('.ex-input, #villanyTotal');
    if(isEditing) {
        btn.innerHTML = '🔓 SZERKESZTÉS'; btn.classList.add('active');
        inputs.forEach(inp => inp.removeAttribute('readonly'));
    } else {
        btn.innerHTML = '🔒 ZÁRVA'; btn.classList.remove('active');
        inputs.forEach(inp => inp.setAttribute('readonly', true));
    }
}

// ELŐZMÉNYEK BETÖLTÉSE
const defaultHistory = [
    { date: '2026. JANUÁR', read: 18372, cons: 1140, cost: 72782 },
    { date: '2025. DECEMBER', read: 17511, cons: 861, cost: 53284 },
    { date: '2025. NOVEMBER', read: 16650, cons: 557, cost: 32002 }
];
let historyLog = JSON.parse(localStorage.getItem('secure_history_v1')) || defaultHistory;

function formatMoney(num) { return Math.round(num).toLocaleString('hu-HU') + " Ft"; }

// FŐ KALKULÁCIÓ
function calc() {
    const vTot = parseFloat(document.getElementById('villanyTotal').value) || 0;
    const vShare = Math.round(vTot / 2);
    document.getElementById('villanyHalf').innerText = formatMoney(vShare);
    
    let others = 0;
    DEFAULT_ITEMS.forEach(item => { others += parseFloat(document.getElementById(`inp_${item.id}`).value) || 0; });
    
    const grand = vShare + others; // Fixek 100% + Villany Átalány 50%
    document.getElementById('grandTotal').innerText = formatMoney(grand);
    return grand;
}

// --- SZÖVEGES ELEMZŐ GENERÁTOR ---
function generateNarrativeHTML(data, isLive = false) {
    const rPart = Math.min(data.cons, MVM_LIMIT);
    const pPart = Math.max(0, data.cons - MVM_LIMIT);
    const rCost = Math.round(rPart * P_REZSI);
    const pCost = Math.round(pPart * P_PIACI);
    const totalMvm = rCost + pCost;
    const halfMvm = Math.round(totalMvm / 2);

    let statusClass = pPart > 0 ? 'over-limit' : 'under-limit';
    let statusText = pPart > 0 ? 
        `Mivel túlléptük a 210 kWh-s keretet, <span class="hl-bad">${pPart} kWh</span> már piaci áron számolódott.` : 
        `Remek! A fogyasztás <span class="hl-good">teljesen a rezsicsökkentett</span> kereten belül maradt.`;

    let title = isLive ? `<span style="color:var(--accent)">ÉLŐ SZÁMOLÁS (${currentMonthStr})</span>` : data.date;

    return `
    <div class="narrative-card ${statusClass}">
        <div class="narrative-header">
            <span>${title}</span>
            <span>${Math.round(data.cons)} kWh</span>
        </div>
        <div class="narrative-body">
            Ebben a hónapban az óraállás <b>${data.read}</b> volt. Ez <b>${Math.round(data.cons)} kWh</b> fogyasztást jelent.
            <br><br>
            ${statusText}
            <br>
            A számított MVM költség: <b>${formatMoney(totalMvm)}</b>.<br>
            <i>(Ennek a fele: ${formatMoney(halfMvm)}, ami tájékoztató jellegű, ha nem átalányt fizetnénk.)</i>
        </div>
    </div>
    `;
}

// --- ÚJ "UPDATE TABLE" HELYETT "RENDER ANALYSIS" ---
function updateLiveNarrative() {
    const container = document.getElementById('narrativeContainer');
    container.innerHTML = '';

    const curr = parseFloat(document.getElementById('mvmCurr').value);
    const prev = parseFloat(document.getElementById('mvmPrev').value);

    // 1. Éves Becslés Frissítése
    let totalConsSoFar = historyLog.reduce((acc, row) => acc + row.cons, 0);
    if(curr && curr > prev) {
        totalConsSoFar += (curr - prev);
    }
    const remainingY = YEARLY_LIMIT - totalConsSoFar;
    const statusColor = remainingY > 1000 ? 'hl-good' : (remainingY > 0 ? 'hl-neutral' : 'hl-bad');
    const statusWord = remainingY > 1000 ? 'BIZTONSÁGOS' : (remainingY > 0 ? 'FIGYELJÜNK!' : 'TÚLLÉPÉS!');
    
    document.getElementById('annualPredictionText').innerHTML = `
        Az éves keretből (8700 kWh) eddig elhasználtunk: <span class="hl-neutral">${Math.round(totalConsSoFar)} kWh</span>-t.
        <br>
        Augusztus 31-ig még rendelkezésre áll: <span class="${statusColor}">${Math.round(remainingY)} kWh</span>.
        <br>
        Státusz: <span class="${statusColor}">${statusWord}</span>
    `;

    // 2. Élő kártya (ha ír be valamit)
    if(curr && curr > prev) {
        const cons = curr - prev;
        const liveData = { read: curr, cons: cons, date: 'Jelenlegi' };
        container.innerHTML += generateNarrativeHTML(liveData, true);
    }

    // 3. Előzmények kártyái
    historyLog.forEach(row => {
        container.innerHTML += generateNarrativeHTML(row);
    });

    if(historyLog.length > 0) document.getElementById('mvmPrev').value = historyLog[0].read;
    else document.getElementById('mvmPrev').value = START_METER;
}

// MENTÉS
function saveInputs() {
    calc();
    let inputsToSave = { villanyTotal: parseFloat(document.getElementById('villanyTotal').value) };
    DEFAULT_ITEMS.forEach(item => { inputsToSave[item.id] = parseFloat(document.getElementById(`inp_${item.id}`).value); });
    localStorage.setItem('expense_settings', JSON.stringify(inputsToSave));
}

function save() {
    const curr = parseFloat(document.getElementById('mvmCurr').value);
    const prev = parseFloat(document.getElementById('mvmPrev').value);
    
    if(!curr || curr <= prev) return alert("Hiba: Adj meg egy érvényes, nagyobb óraállást!");
    
    const cons = curr - prev;
    const cost = Math.round((Math.min(cons, MVM_LIMIT) * P_REZSI) + (Math.max(0, cons - MVM_LIMIT) * P_PIACI));
    
    if(confirm(`Menteni kívánod a hónapot?\nFogyasztás: ${cons} kWh\nBecsült MVM díj: ${formatMoney(cost)}`)) {
        historyLog.unshift({ date: currentMonthStr, read: curr, cons: cons, cost: cost });
        localStorage.setItem('secure_history_v1', JSON.stringify(historyLog));
        document.getElementById('mvmCurr').value = "";
        updateLiveNarrative();
    }
}

// PDF EXPORT
function sharePDF() {
    const element = document.getElementById('contentToShare');
    const editBtn = document.getElementById('editBtn');
    
    element.classList.add('pdf-export-mode'); 
    editBtn.style.display = 'none'; 

    const opt = {
        margin: [5, 5, 5, 5],
        filename: `Szoveges_Elszamolas_${now.getFullYear()}_${now.getMonth()+1}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true, scrollY: 0 },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
    };

    html2pdf().set(opt).from(element).save().then(() => {
        element.classList.remove('pdf-export-mode');
        editBtn.style.display = 'flex';
    });
}

updateLiveNarrative();
calc();
</script>
</body>
</html>
