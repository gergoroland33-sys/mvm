<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rezsi Napló - Javított v19</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
    :root {
        --bg: #0f172a; --card: #1e293b; --primary: #3b82f6; --accent: #f59e0b;
        --text: #f8fafc; --dim: #94a3b8; --border: #334155; --success: #10b981; --danger: #ef4444;
    }
    * { box-sizing: border-box; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); margin: 0; padding: 10px; padding-bottom: 100px; }

    /* HEADER */
    .header-box { text-align: center; margin-bottom: 20px; padding-top: 10px; }
    h1 { margin: 0; font-size: 1.4rem; font-weight: 900; color: white; text-transform: uppercase; }
    
    /* ÉLŐ STATUS BAR */
    .status-bar {
        position: sticky; top: 10px; z-index: 100;
        background: rgba(30, 41, 59, 0.95); border: 1px solid var(--primary); border-radius: 12px;
        padding: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-bottom: 20px;
    }
    .sb-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
    .sb-val { font-size: 1.2rem; font-weight: bold; color: white; }
    .sb-label { font-size: 0.7rem; color: var(--dim); text-transform: uppercase; }
    
    .prog-bg { height: 8px; background: #0f172a; border-radius: 4px; overflow: hidden; position: relative; border: 1px solid var(--border); }
    .prog-fill { height: 100%; transition: width 0.5s ease; background: var(--success); }
    .time-line { position: absolute; top:0; bottom:0; width:2px; background:white; z-index:5; box-shadow: 0 0 5px white; }

    /* FIX GOMB */
    .fix-btn {
        width: 100%; background: var(--card); border: 1px solid var(--border); padding: 12px;
        border-radius: 12px; color: white; font-weight: bold; font-size: 0.8rem;
        display: flex; justify-content: space-between; cursor: pointer; margin-bottom: 20px;
    }

    /* HÓNAP KÁRTYÁK */
    .month-list { display: flex; flex-direction: column; gap: 15px; }
    .card { 
        background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 15px; 
        position: relative;
    }
    .card.active { border: 2px solid var(--primary); background: #243042; }
    
    .c-header { display: flex; justify-content: space-between; margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 5px; }
    .c-title { font-weight: bold; color: white; font-size: 0.9rem; text-transform: uppercase; }
    
    .c-body { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; align-items: center; }
    
    .inp-group label { display: block; font-size: 0.6rem; color: var(--dim); margin-bottom: 3px; }
    .inp { 
        width: 100%; background: #0f172a; border: 1px solid var(--border); color: white; 
        padding: 10px; border-radius: 8px; font-weight: bold; font-size: 1.1rem; text-align: center;
    }
    
    .res-box { text-align: right; }
    .res-total { font-size: 1.3rem; font-weight: 900; color: var(--primary); }
    .res-sub { font-size: 0.65rem; color: var(--dim); margin-top: 3px; }

    /* FAB */
    .fab { position: fixed; bottom: 20px; right: 20px; width: 55px; height: 55px; background: var(--primary); border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; box-shadow: 0 10px 20px rgba(0,0,0,0.5); cursor: pointer; z-index: 100; }

    /* PDF */
    .pdf-mode { background: white !important; color: black !important; padding: 20px !important; }
    .pdf-mode .card, .pdf-mode .status-bar, .pdf-mode .fix-btn { background: white !important; border: 1px solid #ccc !important; color: black !important; box-shadow: none !important; page-break-inside: avoid; }
    .pdf-mode input { color: black !important; border: none !important; background: transparent !important; }
    .pdf-mode .fab { display: none !important; }
</style>
</head>
<body>

<div class="header-box">
    <h1>REZSI NAPLÓ 2025/26</h1>
</div>

<div class="status-bar">
    <div class="sb-row">
        <div>
            <div class="sb-label">Össz. Fogyasztás</div>
            <div class="sb-val" id="d-cons">0 kWh</div>
        </div>
        <div style="text-align:right">
            <div class="sb-label">Éves Keret (8700)</div>
            <div class="sb-val" id="d-rem" style="color:var(--success)">0 kWh</div>
        </div>
    </div>
    <div class="prog-bg">
        <div class="prog-fill" id="p-bar" style="width:0%"></div>
        <div class="time-line" id="t-line" style="left:0%"></div>
    </div>
    <div style="text-align:center; font-size:0.7rem; margin-top:5px; color:var(--dim);" id="d-stat">...</div>
</div>

<div class="fix-btn" onclick="toggleFix()">
    <span>🛠️ FIX KÖLTSÉGEK (Szerkesztés)</span>
    <span><span id="fix-sum">0</span> Ft</span>
</div>
<div id="fix-panel" style="display:none; background:var(--card); padding:15px; border-radius:12px; margin-bottom:20px; border:1px solid var(--border);">
    <div id="fix-list"></div>
</div>

<div class="month-list" id="m-list"></div>

<div class="fab" onclick="genPDF()">💾</div>

<script>
    // --- ALAPADATOK ---
    const START_METER = 17232; // Augusztus 31. záró (Szept 1. nyitó)
    const LIMITS = { mo: 210, yr: 8700 };
    const PRICES = { r: 36.386, p: 70.104 };

    const MONTHS = [
        { id: '2025-09', name: '2025. SZEPTEMBER' },
        { id: '2025-10', name: '2025. OKTÓBER' },
        { id: '2025-11', name: '2025. NOVEMBER' },
        { id: '2025-12', name: '2025. DECEMBER' },
        { id: '2026-01', name: '2026. JANUÁR' },
        { id: '2026-02', name: '2026. FEBRUÁR' },
        { id: '2026-03', name: '2026. MÁRCIUS' },
        { id: '2026-04', name: '2026. ÁPRILIS' },
        { id: '2026-05', name: '2026. MÁJUS' },
        { id: '2026-06', name: '2026. JÚNIUS' },
        { id: '2026-07', name: '2026. JÚLIUS' },
        { id: '2026-08', name: '2026. AUGUSZTUS' }
    ];

    const DEFAULTS = [
        { id: 'tv', name: 'TV', val: 7142 },
        { id: 'tel', name: 'Telefon', val: 4500 },
        { id: 'net', name: 'Internet', val: 2880 },
        { id: 'viz', name: 'Víz', val: 2500 },
        { id: 'bizt', name: 'Biztosítás', val: 2386 },
        { id: 'szemet', name: 'Szemét', val: 667 },
        { id: 'komm', name: 'Adó', val: 600 },
        { id: 'vat', name: 'Villany Átalány', val: 0 } // Ha van fix átalány, írd át!
    ];

    // CSV-ből kinyert pontos záró adatok (a korábban küldött fájlok alapján)
    // Szept: 17583, Okt: 17814, Nov: 18372, Dec: 19233
    let readings = JSON.parse(localStorage.getItem('rezsi_v19_readings')) || {
        '2025-09': 17583,
        '2025-10': 17814,
        '2025-11': 18372,
        '2025-12': 19233
    };
    let fixes = JSON.parse(localStorage.getItem('rezsi_v19_fixes')) || {};

    // --- RENDER ---
    function init() {
        renderFixes();
        renderMonths();
        calc();
    }

    function renderFixes() {
        const c = document.getElementById('fix-list');
        c.innerHTML = '';
        DEFAULTS.forEach(f => {
            const val = fixes[f.id] !== undefined ? fixes[f.id] : f.val;
            c.innerHTML += `
            <div style="display:flex; justify-content:space-between; margin-bottom:8px; font-size:0.8rem;">
                <span>${f.name}</span>
                <input type="number" value="${val}" onchange="saveFix('${f.id}', this.value)" 
                style="background:#0f172a; border:1px solid #334155; color:white; width:80px; text-align:right;">
            </div>`;
        });
    }

    function renderMonths() {
        const c = document.getElementById('m-list');
        c.innerHTML = '';
        const nowId = new Date().toISOString().slice(0, 7);

        MONTHS.forEach(m => {
            const val = readings[m.id] || '';
            const active = m.id === nowId ? 'active' : '';
            c.innerHTML += `
            <div class="card ${active}" id="c-${m.id}">
                <div class="c-header">
                    <span class="c-title">${m.name}</span>
                    <span style="font-size:0.7rem; color:var(--dim);">Nyitó: <span id="start-${m.id}">...</span></span>
                </div>
                <div class="c-body">
                    <div class="inp-group">
                        <label>ZÁRÓ ÁLLÁS</label>
                        <input type="number" class="inp" placeholder="..." value="${val}" oninput="saveRead('${m.id}', this.value)">
                    </div>
                    <div class="res-box">
                        <div class="res-total" id="cost-${m.id}">0 Ft</div>
                        <div class="res-sub" id="info-${m.id}">...</div>
                    </div>
                </div>
            </div>`;
        });
        
        setTimeout(() => {
            const el = document.querySelector('.card.active');
            if(el) el.scrollIntoView({behavior:"smooth", block:"center"});
        }, 500);
    }

    // --- MATEK ---
    function calc() {
        // 1. Fixek összege
        let fixSum = 0;
        DEFAULTS.forEach(f => {
            fixSum += (fixes[f.id] !== undefined ? fixes[f.id] : f.val);
        });
        document.getElementById('fix-sum').innerText = fixSum.toLocaleString();

        // 2. Hónapok
        let prev = START_METER;
        let totalCons = 0;

        MONTHS.forEach(m => {
            document.getElementById(`start-${m.id}`).innerText = prev;
            const curr = readings[m.id];
            
            const costEl = document.getElementById(`cost-${m.id}`);
            const infoEl = document.getElementById(`info-${m.id}`);

            if(curr && curr > prev) {
                const cons = curr - prev;
                totalCons += cons;

                // Tiszta áram ár
                const r = Math.min(cons, LIMITS.mo);
                const p = Math.max(0, cons - LIMITS.mo);
                const mvm = Math.round((r * PRICES.r) + (p * PRICES.p));
                
                // VÉGÖSSZEG = Áram + Fixek (Nincs felezés!)
                const total = mvm + fixSum;

                costEl.innerText = `${total.toLocaleString()} Ft`;
                infoEl.innerHTML = `Fogy: ${cons} kWh | Áram: ${mvm} | Fix: ${fixSum}`;
                
                prev = curr;
            } else {
                costEl.innerText = "-";
                infoEl.innerText = "Nincs adat";
                if(curr) prev = curr; 
            }
        });

        // 3. Status Bar
        const rem = LIMITS.yr - totalCons;
        const pct = (totalCons / LIMITS.yr) * 100;
        
        document.getElementById('d-cons').innerText = totalCons + " kWh";
        document.getElementById('d-rem').innerText = rem + " kWh";
        document.getElementById('p-bar').style.width = Math.min(pct, 100) + "%";
        
        // Idővonal
        const start = new Date('2025-08-31');
        const end = new Date('2026-08-31');
        const now = new Date();
        const tPct = ((now - start) / (end - start)) * 100;
        document.getElementById('t-line').style.left = Math.min(Math.max(tPct,0),100) + "%";
        
        const stat = document.getElementById('d-stat');
        const bar = document.getElementById('p-bar');
        
        if(pct > tPct) {
            bar.style.background = "var(--danger)";
            stat.innerHTML = "<span style='color:var(--danger)'>TÚLFOGYASZTÁS!</span> (A csík megelőzte a mai napot)";
        } else {
            bar.style.background = "var(--success)";
            stat.innerHTML = "<span style='color:var(--success)'>RENDBEN.</span> (Van tartalék)";
        }
    }

    // --- ESZKÖZÖK ---
    function saveRead(id, val) {
        if(val) readings[id] = parseFloat(val);
        else delete readings[id];
        localStorage.setItem('rezsi_v19_readings', JSON.stringify(readings));
        calc();
    }

    function saveFix(id, val) {
        fixes[id] = parseFloat(val);
        localStorage.setItem('rezsi_v19_fixes', JSON.stringify(fixes));
        calc();
    }

    function toggleFix() {
        const el = document.getElementById('fix-panel');
        el.style.display = el.style.display === 'none' ? 'block' : 'none';
    }

    function genPDF() {
        document.body.classList.add('pdf-mode');
        const opt = { margin: 5, filename: 'Rezsi_Naplo.pdf', image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } };
        html2pdf().set(opt).from(document.body).save().then(() => document.body.classList.remove('pdf-mode'));
    }

    init();
</script>
</body>
</html>
