<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rezsi Manager Share v25</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
    :root {
        --bg: #0b0f19; --surface: #151e2e; --primary: #3b82f6; --accent: #f59e0b;
        --text: #f1f5f9; --dim: #64748b; --border: #1f2937;
        --success: #10b981; --danger: #ef4444;
    }
    * { box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); margin: 0; padding: 0; padding-top: 160px; padding-bottom: 90px; }

    /* --- STICKY DASHBOARD --- */
    .sticky-dashboard {
        position: fixed; top: 0; left: 0; width: 100%; z-index: 2000;
        background: rgba(11, 15, 25, 0.98); backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--border); padding: 15px 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .db-top { display: flex; justify-content: space-between; align-items: end; margin-bottom: 5px; }
    .db-big { font-size: 1.4rem; font-weight: 900; color: white; }
    .db-lbl { font-size: 0.65rem; color: var(--dim); font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
    
    .progress-container { position: relative; height: 16px; background: #1f2937; border-radius: 8px; overflow: hidden; margin-top: 8px; border: 1px solid var(--border); }
    .progress-bar { height: 100%; transition: width 0.5s ease; border-right: 2px solid rgba(0,0,0,0.5); }
    .time-indicator { position: absolute; top: 0; bottom: 0; width: 2px; background: white; z-index: 10; box-shadow: 0 0 10px white; }
    .status-text { text-align: center; font-size: 0.75rem; margin-top: 8px; font-weight: 700; }

    /* --- TABS --- */
    .nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 70px; background: #151e2e; border-top: 1px solid var(--border); display: flex; z-index: 1000; }
    .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--dim); cursor: pointer; transition: 0.2s; border-top: 2px solid transparent; }
    .nav-item.active { color: var(--primary); border-top-color: var(--primary); background: rgba(59,130,246,0.05); }
    .nav-icon { font-size: 1.4rem; margin-bottom: 4px; }
    .nav-lbl { font-size: 0.7rem; font-weight: 800; text-transform: uppercase; }

    /* --- PAGES --- */
    .page { display: none; padding: 20px; animation: fadeIn 0.3s; }
    .page.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* --- CARDS & INPUTS --- */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 15px; margin-bottom: 15px; position: relative; }
    .card.active { border: 1px solid var(--primary); background: #1e2837; }
    .c-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .c-title { font-weight: 800; color: white; font-size: 0.9rem; text-transform: uppercase; }
    .c-sub { font-size: 0.65rem; color: var(--dim); font-family: monospace; }
    .meter-row { display: flex; justify-content: space-between; align-items: center; gap: 15px; }
    .meter-input { width: 120px; background: #0b0f19; border: 1px solid var(--border); color: white; padding: 10px; border-radius: 8px; font-weight: 700; font-size: 1.1rem; text-align: center; outline: none; font-family: monospace; }
    .meter-input:focus { border-color: var(--accent); }
    .res-box { text-align: right; flex: 1; }
    .res-cost { font-size: 1.3rem; font-weight: 900; color: var(--primary); }
    .res-cons { font-size: 0.75rem; color: var(--dim); }
    .res-alert { color: var(--danger); font-size: 0.7rem; font-weight: bold; display: block; margin-top: 2px; }

    /* --- FAMILY --- */
    .hero { background: linear-gradient(135deg, #1e3a8a, #172554); text-align: center; padding: 25px; border: 1px solid var(--primary); }
    .pay-val { color: white; font-size: 2.5rem; font-weight: 900; margin: 10px 0; letter-spacing: -1px; }
    .fix-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px dashed var(--border); }
    .fix-name-in { background: transparent; border: none; color: #cbd5e1; font-size: 0.9rem; width: 100%; font-weight: bold; }
    .fix-val-in { background: #0b0f19; border: 1px solid var(--border); color: white; padding: 5px; border-radius: 6px; text-align: right; width: 90px; font-weight: bold; }
    .fix-del { color: var(--danger); background: none; border: none; font-size: 1.2rem; cursor: pointer; margin-left: 10px; }
    .add-btn { width: 100%; padding: 12px; background: rgba(59, 130, 246, 0.1); color: var(--primary); border: 1px dashed var(--primary); border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 15px; }

    /* --- FAB --- */
    .fab { position: fixed; bottom: 85px; right: 20px; width: 60px; height: 60px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: black; font-size: 1.5rem; box-shadow: 0 10px 30px rgba(0,0,0,0.5); cursor: pointer; z-index: 100; font-weight: bold; }

    /* --- PDF CONTAINER (Rejtett, csak generáláskor töltjük fel) --- */
    #pdf-container {
        display: none;
        background-color: #0b0f19; /* SÖTÉT HÁTTÉR */
        color: #f1f5f9;
        padding: 20px;
        font-family: sans-serif;
        width: 100%;
        max-width: 800px;
    }
    /* PDF specifikus stílusok */
    .pdf-header { text-align: center; border-bottom: 1px solid #3b82f6; padding-bottom: 10px; margin-bottom: 20px; }
    .pdf-card { background: #151e2e; border: 1px solid #1f2937; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
    .pdf-hero { background: #1e3a8a; color: white; text-align: center; padding: 20px; border-radius: 10px; margin-bottom: 20px; border: 2px solid #3b82f6; }
    .pdf-row { display: flex; justify-content: space-between; border-bottom: 1px solid #334155; padding: 8px 0; font-size: 12px; }
    .pdf-accent { color: #f59e0b; font-weight: bold; }
    .pdf-primary { color: #3b82f6; font-weight: bold; }
    .pdf-danger { color: #ef4444; font-weight: bold; }
</style>
</head>
<body>

<div class="sticky-dashboard">
    <div class="db-top">
        <div>
            <div class="db-lbl">ÖSSZ. FOGYASZTÁS</div>
            <div class="db-big" id="d-cons">0.000</div>
        </div>
        <div style="text-align:right">
            <div class="db-lbl">ÉVES KERET (8700)</div>
            <div class="db-big" id="d-rem" style="color:var(--success)">0.000</div>
        </div>
    </div>
    <div class="progress-container">
        <div class="progress-bar" id="prog-bar" style="width:0%; background:var(--success)"></div>
        <div class="time-indicator" id="time-mark" style="left:0%"></div>
    </div>
    <div class="status-text" id="status-msg">...</div>
</div>

<div id="page-elec" class="page active">
    <div id="month-list"></div>
</div>

<div id="page-family" class="page">
    <div class="card hero">
        <div style="font-size:0.7rem; color:#bfdbfe; font-weight:800; letter-spacing:2px;">UTALANDÓ (ANYU RÉSZE)</div>
        <div class="pay-val" id="family-total">0 Ft</div>
        <div style="font-size:0.75rem; color:#bfdbfe;">(Villany fele + Fixek 100%)</div>
    </div>

    <div class="card">
        <div class="c-header"><span class="c-title">FIX KÖLTSÉGEK LISTÁJA</span></div>
        <div id="fix-container"></div>
        <button class="add-btn" onclick="addFix()">+ ÚJ TÉTEL</button>
    </div>
</div>

<div class="fab" onclick="sharePDF()">📤</div>

<div class="nav">
    <div class="nav-item active" id="nav-elec" onclick="switchTab('elec')">
        <div class="nav-icon">⚡</div>
        <div class="nav-lbl">Áram</div>
    </div>
    <div class="nav-item" id="nav-family" onclick="switchTab('family')">
        <div class="nav-icon">💰</div>
        <div class="nav-lbl">Család</div>
    </div>
</div>

<div id="pdf-container"></div>

<script>
    // --- KONFIGURÁCIÓ ---
    const START_METER = 17232.475; 
    const LIMITS = { mo: 210, yr: 8700 };
    const PRICES = { r: 36.386, p: 70.104 }; 

    const MONTHS = [
        { id: '2025-09', name: '2025. SZEPT' },
        { id: '2025-10', name: '2025. OKT' },
        { id: '2025-11', name: '2025. NOV' },
        { id: '2025-12', name: '2025. DEC' },
        { id: '2026-01', name: '2026. JAN' },
        { id: '2026-02', name: '2026. FEBR' },
        { id: '2026-03', name: '2026. MÁRC' },
        { id: '2026-04', name: '2026. ÁPR' },
        { id: '2026-05', name: '2026. MÁJ' },
        { id: '2026-06', name: '2026. JÚN' },
        { id: '2026-07', name: '2026. JÚL' },
        { id: '2026-08', name: '2026. AUG' }
    ];

    const HARDCODED_HISTORY = {
        '2025-09': 17583.501,
        '2025-10': 17814.641,
        '2025-11': 18372.135,
        '2025-12': 19233.215
    };

    // --- STATE ---
    let readings = JSON.parse(localStorage.getItem('v25_readings')) || HARDCODED_HISTORY;
    if (Object.keys(readings).length < Object.keys(HARDCODED_HISTORY).length) {
        readings = { ...HARDCODED_HISTORY, ...readings };
    }

    let fixItems = JSON.parse(localStorage.getItem('v25_fixes')) || [
        { name: 'TV Előfizetés', val: 7142 },
        { name: 'Telefon', val: 4500 },
        { name: 'Internet', val: 2880 },
        { name: 'Víz', val: 2500 },
        { name: 'Biztosítás', val: 2386 },
        { name: 'Szemét', val: 667 },
        { name: 'Adó', val: 600 }
    ];

    let lastCalculatedMvm = 0; 

    // --- INIT ---
    function init() {
        renderMonths();
        renderFixes();
        calcAll();
    }

    function renderMonths() {
        const c = document.getElementById('month-list');
        c.innerHTML = '';
        const nowId = new Date().toISOString().slice(0, 7);

        MONTHS.forEach(m => {
            const val = readings[m.id] || '';
            const active = m.id === nowId ? 'active' : '';
            c.innerHTML += `
            <div class="card ${active}" id="c-${m.id}">
                <div class="c-header">
                    <span class="c-title">${m.name}</span>
                    <span class="c-sub">NYITÓ: <span id="start-${m.id}">...</span></span>
                </div>
                <div class="meter-row">
                    <input type="number" step="0.001" class="meter-input" placeholder="ZÁRÓ" 
                        value="${val}" oninput="updateRead('${m.id}', this.value)">
                    <div class="res-box">
                        <div class="res-cost" id="cost-${m.id}">0 Ft</div>
                        <div class="res-cons" id="cons-${m.id}">...</div>
                        <div class="res-alert" id="alert-${m.id}"></div>
                    </div>
                </div>
            </div>`;
        });
        setTimeout(() => {
            const el = document.querySelector('.card.active');
            if(el) el.scrollIntoView({behavior:"smooth", block:"center"});
        }, 500);
    }

    function renderFixes() {
        const c = document.getElementById('fix-container');
        c.innerHTML = '';
        fixItems.forEach((item, idx) => {
            c.innerHTML += `
            <div class="fix-row">
                <input type="text" class="fix-name-in" value="${item.name}" oninput="updateFix(${idx}, 'name', this.value)">
                <div style="display:flex; align-items:center;">
                    <input type="number" class="fix-val-in" value="${item.val}" oninput="updateFix(${idx}, 'val', this.value)">
                    <span style="color:#64748b; font-size:0.8rem; margin-left:5px;">Ft</span>
                    <button class="fix-del" onclick="delFix(${idx})">×</button>
                </div>
            </div>`;
        });
    }

    function calcAll() {
        let prev = START_METER;
        let totalCons = 0;
        lastCalculatedMvm = 0;

        MONTHS.forEach(m => {
            document.getElementById(`start-${m.id}`).innerText = prev.toFixed(3);
            const curr = readings[m.id];
            const costEl = document.getElementById(`cost-${m.id}`);
            const consEl = document.getElementById(`cons-${m.id}`);
            const alertEl = document.getElementById(`alert-${m.id}`);

            if (curr && curr > prev) {
                let cons = curr - prev;
                cons = Math.round(cons * 1000) / 1000;
                totalCons += cons;

                const r = Math.min(cons, LIMITS.mo);
                const p = Math.max(0, cons - LIMITS.mo);
                const mvm = Math.round((r * PRICES.r) + (p * PRICES.p));

                consEl.innerText = `${cons.toFixed(3)} kWh`;
                costEl.innerText = `${mvm.toLocaleString()} Ft`;
                alertEl.innerHTML = p > 0 ? `⚠️ ${p.toFixed(3)} kWh túllépés!` : "";

                prev = curr;
                lastCalculatedMvm = mvm; 
            } else {
                costEl.innerText = "-";
                consEl.innerText = "";
                alertEl.innerHTML = "";
                if(curr) prev = curr; 
            }
        });

        updateSticky(totalCons);
        updateFamily();
    }

    function updateSticky(total) {
        const rem = LIMITS.yr - total;
        const pct = (total / LIMITS.yr) * 100;
        
        document.getElementById('d-cons').innerText = total.toFixed(3);
        document.getElementById('d-rem').innerText = rem.toFixed(3);
        
        const bar = document.getElementById('prog-bar');
        const mark = document.getElementById('time-mark');
        const msg = document.getElementById('status-msg');
        
        bar.style.width = Math.min(pct, 100) + "%";
        
        const start = new Date('2025-08-31');
        const end = new Date('2026-08-31');
        const now = new Date();
        const timePct = ((now - start) / (end - start)) * 100;
        mark.style.left = Math.min(Math.max(timePct,0),100) + "%";
        
        if(pct > timePct) {
            bar.style.background = "var(--danger)";
            msg.innerHTML = "<span style='color:var(--danger)'>TÚLLÉPÉS!</span> A fogyasztás megelőzte az időt.";
        } else {
            bar.style.background = "var(--success)";
            msg.innerHTML = "<span style='color:var(--success)'>RENDBEN.</span> A fogyasztás az idő alatt van.";
        }
    }

    function updateFamily() {
        let fixSum = 0;
        fixItems.forEach(i => fixSum += Number(i.val));
        const mvmHalf = Math.round(lastCalculatedMvm / 2);
        const grand = mvmHalf + fixSum;
        document.getElementById('family-total').innerText = grand.toLocaleString() + " Ft";
    }

    // --- MENTÉSEK ---
    function updateRead(id, val) {
        if(val) readings[id] = parseFloat(val);
        else delete readings[id];
        localStorage.setItem('v25_readings', JSON.stringify(readings));
        calcAll();
    }

    function updateFix(idx, field, val) {
        fixItems[idx][field] = val;
        localStorage.setItem('v25_fixes', JSON.stringify(fixItems));
        updateFamily();
    }

    function addFix() {
        fixItems.push({ name: 'Új', val: 0 });
        renderFixes();
        localStorage.setItem('v25_fixes', JSON.stringify(fixItems));
    }

    function delFix(idx) {
        if(confirm("Törlés?")) {
            fixItems.splice(idx, 1);
            renderFixes();
            localStorage.setItem('v25_fixes', JSON.stringify(fixItems));
            updateFamily();
        }
    }

    function switchTab(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById('page-'+id).classList.add('active');
        document.getElementById('nav-'+id).classList.add('active');
        window.scrollTo(0,0);
    }

    // --- SÖTÉT MÓD PDF GENERÁTOR ---
    function sharePDF() {
        const pc = document.getElementById('pdf-container');
        pc.innerHTML = '';
        
        // 1. HEADER
        const cons = document.getElementById('d-cons').innerText;
        const rem = document.getElementById('d-rem').innerText;
        
        pc.innerHTML += `
            <div class="pdf-header">
                <h2 style="color:#3b82f6; margin:0;">REZSI JELENTÉS</h2>
                <div style="font-size:12px; color:#94a3b8;">${new Date().toLocaleDateString()}</div>
            </div>
            
            <div class="pdf-card" style="display:flex; justify-content:space-between;">
                <div><div style="color:#94a3b8; font-size:10px;">FOGYASZTÁS</div><div style="font-weight:bold;">${cons} kWh</div></div>
                <div style="text-align:right"><div style="color:#94a3b8; font-size:10px;">KERET MARADT</div><div style="font-weight:bold; color:#10b981;">${rem} kWh</div></div>
            </div>
        `;

        // 2. FAMILY SUMMARY
        const total = document.getElementById('family-total').innerText;
        let fixSum = 0; fixItems.forEach(f => fixSum += Number(f.val));
        const mvmHalf = Math.round(lastCalculatedMvm / 2);
        
        pc.innerHTML += `
            <div class="pdf-hero">
                <div style="font-size:12px; color:#bfdbfe;">UTALANDÓ (ANYU)</div>
                <div style="font-size:32px; font-weight:900;">${total}</div>
                <div style="font-size:10px;">MVM/2 (${mvmHalf}) + FIXEK (${fixSum})</div>
            </div>
        `;

        // 3. FIX LIST
        let fixHtml = '';
        fixItems.forEach(f => {
            fixHtml += `<div class="pdf-row"><span>${f.name}</span><span style="font-weight:bold;">${Number(f.val).toLocaleString()} Ft</span></div>`;
        });
        pc.innerHTML += `<div class="pdf-card"><div style="font-weight:bold; color:#f59e0b; font-size:12px; margin-bottom:5px;">FIX KÖLTSÉGEK</div>${fixHtml}</div>`;

        // 4. METER LIST
        let meterHtml = '';
        let prev = START_METER;
        MONTHS.forEach(m => {
            const curr = readings[m.id];
            if(curr && curr > prev) {
                let c = curr - prev;
                let r = Math.min(c, LIMITS.mo);
                let p = Math.max(0, c - LIMITS.mo);
                let cost = Math.round(r*PRICES.r + p*PRICES.p);
                meterHtml += `
                <div class="pdf-row">
                    <div>
                        <div style="color:#94a3b8;">${m.name}</div>
                        <div style="font-size:10px;">${c.toFixed(1)} kWh</div>
                    </div>
                    <div style="text-align:right;">
                        <div class="pdf-primary">${cost.toLocaleString()} Ft</div>
                        <div style="font-size:10px; color:${p>0?'#ef4444':'#10b981'}">${p>0?'Túllépés':'Ok'}</div>
                    </div>
                </div>`;
                prev = curr;
            }
        });
        pc.innerHTML += `<div class="pdf-card"><div style="font-weight:bold; color:#3b82f6; font-size:12px; margin-bottom:5px;">VILLANY RÉSZLETEK</div>${meterHtml}</div>`;

        // GENERATE
        pc.style.display = 'block';
        const opt = { 
            margin: 0, 
            filename: 'Rezsi_Share.pdf', 
            image: { type: 'jpeg', quality: 0.98 }, 
            html2canvas: { scale: 2, backgroundColor: '#0b0f19' }, 
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } 
        };

        html2pdf().set(opt).from(pc).output('blob').then(blob => {
            pc.style.display = 'none';
            const file = new File([blob], "Rezsi_Jelentes.pdf", { type: "application/pdf" });
            
            // TRY SHARE
            if (navigator.share) {
                navigator.share({
                    files: [file],
                    title: 'Rezsi',
                    text: `Aktuális elszámolás: ${total}`
                }).catch(err => console.log('Share canceled', err));
            } else {
                // Fallback: Download
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = 'Rezsi_Share.pdf'; a.click();
            }
        });
    }

    init();
</script>
</body>
</html>
