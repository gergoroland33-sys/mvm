<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Családi Elszámolás Pro v2</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0f1a; --card: #161e2d; --primary: #3b82f6; --accent: #f59e0b;
            --text: #f8fafc; --dim: #94a3b8; --border: #2d3748; --success: #10b981;
            --danger: #ef4444; --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); margin: 0; padding: 15px; padding-bottom: 120px; line-height: 1.5; }

        /* HEADER */
        .header-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding: 10px 5px; }
        h1 { margin: 0; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.5px; background: linear-gradient(135deg, #fff 0%, #94a3b8 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .date-badge { background: rgba(59, 130, 246, 0.1); border: 1px solid var(--primary); color: var(--primary); padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 800; }

        /* KÁRTYA DESIGN */
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 20px; margin-bottom: 20px; box-shadow: var(--shadow); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .card-title { font-size: 0.85rem; font-weight: 800; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }

        /* SZÁMOK ÉS INPUTOK */
        .highlight-box { background: rgba(0,0,0,0.2); border-radius: 16px; padding: 20px; border: 1px solid rgba(255,255,255,0.05); }
        .main-val { font-size: 2rem; font-weight: 900; color: white; display: flex; align-items: baseline; gap: 5px; }
        .main-val span { font-size: 1rem; color: var(--dim); }

        .expense-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .expense-name { font-weight: 600; color: #e2e8f0; }
        .expense-input-wrapper { display: flex; align-items: center; gap: 8px; }
        .val-input { background: transparent; border: none; color: var(--accent); font-weight: 800; font-size: 1.1rem; width: 85px; text-align: right; outline: none; transition: 0.3s; }
        .val-input:not([readonly]) { background: rgba(245, 158, 11, 0.1); border-radius: 6px; padding: 2px 5px; }

        /* MVM PROGRESS BAR */
        .progress-container { margin: 20px 0; }
        .progress-labels { display: flex; justify-content: space-between; font-size: 0.7rem; font-weight: 700; margin-bottom: 8px; text-transform: uppercase; }
        .bar-bg { height: 12px; background: #1e293b; border-radius: 6px; overflow: hidden; display: flex; }
        .bar-rezsi { height: 100%; background: var(--success); transition: 0.5s ease; }
        .bar-piaci { height: 100%; background: var(--danger); transition: 0.5s ease; }
        
        /* ÖSSZESÍTŐ BOX */
        .summary-card { background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); border: none; color: white; text-align: center; position: relative; overflow: hidden; }
        .summary-card::after { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%); }
        .summary-label { font-size: 0.8rem; font-weight: 700; opacity: 0.9; text-transform: uppercase; }
        .summary-amount { font-size: 3rem; font-weight: 900; margin: 10px 0; letter-spacing: -1px; }

        /* TÁBLÁZAT */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; font-size: 0.65rem; color: var(--dim); text-transform: uppercase; padding: 10px 5px; }
        td { padding: 12px 5px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.85rem; }
        .badge { padding: 2px 6px; border-radius: 4px; font-size: 0.65rem; font-weight: 800; text-transform: uppercase; }
        .badge-rezsi { background: rgba(16, 185, 129, 0.1); color: var(--success); }
        .badge-piaci { background: rgba(239, 68, 68, 0.1); color: var(--danger); }

        /* FLOATING ACTION BUTTONS */
        .actions { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; z-index: 1000; width: 90%; max-width: 400px; }
        .btn { flex: 1; padding: 16px; border-radius: 18px; border: none; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 10px 20px rgba(0,0,0,0.3); transition: 0.2s; }
        .btn-save { background: white; color: black; }
        .btn-pdf { background: var(--primary); color: white; }
        .btn:active { transform: scale(0.95); }

        /* EDIT TOGGLE */
        .edit-toggle { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--dim); padding: 6px 12px; border-radius: 10px; font-size: 0.7rem; font-weight: 700; cursor: pointer; }
        .edit-toggle.active { border-color: var(--accent); color: var(--accent); }

        /* LOADING */
        #loader { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 9999; align-items: center; justify-content: center; flex-direction: column; }
        
        /* PDF EXPORT MODE STYLES */
        .pdf-mode { background: white !important; color: #0f172a !important; padding: 40px !important; }
        .pdf-mode .card { background: #f8fafc !important; border: 1px solid #e2e8f0 !important; box-shadow: none !important; }
        .pdf-mode .summary-card { background: #1e293b !important; }
        .pdf-mode .val-input, .pdf-mode .main-val { color: #0f172a !important; }
        .pdf-mode .edit-toggle, .pdf-mode .actions, .pdf-mode .mvm-inputs-row { display: none !important; }
    </style>
</head>
<body>

<div id="loader"><div style="width:40px;height:40px;border:4px solid var(--primary);border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite"></div><p>PDF Generálása...</p></div>

<div id="app-content">
    <div class="header-container">
        <h1>ELSZÁMOLÁS PRO</h1>
        <div class="date-badge" id="currentDate">2026. JANUÁR</div>
    </div>

    <div class="card summary-card">
        <div class="summary-label">Fizetendő összesen (Anyu)</div>
        <div class="summary-amount" id="grandTotal">0 Ft</div>
        <div style="font-size: 0.75rem; opacity: 0.8; font-weight: 600;">Minden rezsi költséggel együtt</div>
    </div>

    <div class="card">
        <div class="card-header">
            <div class="card-title">Fixed Költségek</div>
            <button class="edit-toggle" id="editBtn" onclick="toggleEdit()">Szerkesztés</button>
        </div>
        
        <div class="highlight-box" style="margin-bottom: 15px;">
            <div style="font-size: 0.7rem; font-weight: 800; color: var(--primary); margin-bottom: 5px; text-transform: uppercase;">Villany Átalány (50%)</div>
            <div class="main-val" id="villanyDisplay">0 <span>Ft</span></div>
            <input type="number" id="villanyTotal" value="55000" style="display:none" oninput="updateAll()">
        </div>

        <div id="expenseList">
            </div>
    </div>

    <div class="card">
        <div class="card-header">
            <div class="card-title">MVM Energia Kontroll</div>
        </div>

        <div class="mvm-inputs-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;">
            <div>
                <label style="font-size: 0.65rem; color: var(--dim); display:block; margin-bottom:5px;">Előző óraállás</label>
                <input type="number" id="mvmPrev" readonly style="width:100%; background: rgba(0,0,0,0.2); border: 1px solid var(--border); color: white; padding: 10px; border-radius: 10px; font-weight: 800;">
            </div>
            <div>
                <label style="font-size: 0.65rem; color: var(--dim); display:block; margin-bottom:5px;">Friss óraállás</label>
                <input type="number" id="mvmCurr" placeholder="Beírás..." oninput="updateAll()" style="width:100%; background: rgba(59,130,246,0.1); border: 1px solid var(--primary); color: white; padding: 10px; border-radius: 10px; font-weight: 800;">
            </div>
        </div>

        <div class="progress-container">
            <div class="progress-labels">
                <span id="labelRezsi">Rezsi: 0 kWh</span>
                <span id="labelPiaci">Piaci: 0 kWh</span>
            </div>
            <div class="bar-bg">
                <div id="barRezsi" class="bar-rezsi" style="width: 0%"></div>
                <div id="barPiaci" class="bar-piaci" style="width: 0%"></div>
            </div>
            <div style="text-align: center; margin-top: 10px;">
                <div style="font-size: 0.7rem; color: var(--dim);">Becsült aktuális havi költség:</div>
                <div id="liveMvmCost" style="font-size: 1.2rem; font-weight: 900; color: var(--success);">0 Ft</div>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Időszak</th>
                    <th>Fogyasztás</th>
                    <th style="text-align:right">Költség</th>
                </tr>
            </thead>
            <tbody id="mvmHistory"></tbody>
        </table>
    </div>
</div>

<div class="actions">
    <button class="btn btn-save" onclick="saveData()">💾 MENTÉS</button>
    <button class="btn btn-pdf" onclick="exportPDF()">📤 PDF KÜLDÉS</button>
</div>

<script>
    const CONFIG = {
        limit: 210,
        rezsiAr: 36.386,
        piaciAr: 70.104,
        items: [
            { id: 'tv', name: 'TV Előfizetés', val: 7142 },
            { id: 'tel', name: 'Mobiltelefon', val: 4500 },
            { id: 'net', name: 'Optikai Internet', val: 2880 },
            { id: 'viz', name: 'Vízfogyasztás', val: 2500 },
            { id: 'bizt', name: 'Lakásbiztosítás', val: 2386 },
            { id: 'szemet', name: 'Szemétszállítás', val: 667 },
            { id: 'komm', name: 'Kommunális adó', val: 600 }
        ]
    };

    let isEditing = false;
    let history = JSON.parse(localStorage.getItem('pro_history_v2')) || [
        { date: '2025. DECEMBER', read: 18372, cons: 861, cost: 53284 },
        { date: '2025. NOVEMBER', read: 17814, cons: 557, cost: 32002 }
    ];

    function init() {
        const monthNames = ["JANUÁR","FEBRUÁR","MÁRCIUS","ÁPRILIS","MÁJUS","JÚNIUS","JÚLIUS","AUGUSZTUS","SZEPTEMBER","OKTÓBER","NOVEMBER","DECEMBER"];
        const d = new Date();
        document.getElementById('currentDate').innerText = `${d.getFullYear()}. ${monthNames[d.getMonth()]}`;
        
        const list = document.getElementById('expenseList');
        const savedVals = JSON.parse(localStorage.getItem('pro_settings')) || {};
        
        CONFIG.items.forEach(item => {
            const val = savedVals[item.id] || item.val;
            list.innerHTML += `
                <div class="expense-row">
                    <span class="expense-name">${item.name}</span>
                    <div class="expense-input-wrapper">
                        <input type="number" class="val-input" id="inp_${item.id}" value="${val}" readonly oninput="updateAll()">
                        <span style="font-size:0.7rem; color:var(--dim); font-weight:800">FT</span>
                    </div>
                </div>`;
        });

        if(history.length > 0) document.getElementById('mvmPrev').value = history[0].read;
        updateAll();
    }

    function toggleEdit() {
        isEditing = !isEditing;
        const btn = document.getElementById('editBtn');
        const inputs = document.querySelectorAll('.val-input, #villanyTotal');
        btn.classList.toggle('active');
        btn.innerText = isEditing ? 'Kész' : 'Szerkesztés';
        inputs.forEach(i => i.readOnly = !isEditing);
        document.getElementById('villanyTotal').style.display = isEditing ? 'block' : 'none';
    }

    function updateAll() {
        // Villany matek
        const vTotal = parseFloat(document.getElementById('villanyTotal').value) || 0;
        const vShare = vTotal / 2;
        document.getElementById('villanyDisplay').innerHTML = `${vShare.toLocaleString()} <span>Ft</span>`;

        // Egyéb költségek
        let others = 0;
        CONFIG.items.forEach(item => {
            others += parseFloat(document.getElementById(`inp_${item.id}`).value) || 0;
        });

        const total = vShare + others;
        document.getElementById('grandTotal').innerText = `${Math.round(total).toLocaleString()} Ft`;

        // MVM Matek
        const curr = parseFloat(document.getElementById('mvmCurr').value) || 0;
        const prev = parseFloat(document.getElementById('mvmPrev').value) || 0;
        const historyTable = document.getElementById('mvmHistory');
        
        let liveCons = 0;
        let liveCost = 0;

        if (curr > prev) {
            liveCons = curr - prev;
            const rezsiPart = Math.min(liveCons, CONFIG.limit);
            const piaciPart = Math.max(0, liveCons - CONFIG.limit);
            liveCost = (rezsiPart * CONFIG.rezsiAr) + (piaciPart * CONFIG.piaciAr);

            // Bar update
            const rPercent = (rezsiPart / Math.max(liveCons, CONFIG.limit)) * 100;
            const pPercent = (piaciPart / Math.max(liveCons, CONFIG.limit)) * 100;
            document.getElementById('barRezsi').style.width = rPercent + '%';
            document.getElementById('barPiaci').style.width = pPercent + '%';
            document.getElementById('labelRezsi').innerText = `Rezsi: ${Math.round(rezsiPart)} kWh`;
            document.getElementById('labelPiaci').innerText = `Piaci: ${Math.round(piaciPart)} kWh`;
            document.getElementById('liveMvmCost').innerText = `${Math.round(liveCost).toLocaleString()} Ft`;
        }

        // History render
        historyTable.innerHTML = '';
        history.forEach(row => {
            const isOver = row.cons > CONFIG.limit;
            historyTable.innerHTML += `
                <tr>
                    <td><div style="font-weight:700">${row.date}</div><div style="font-size:0.6rem; color:var(--dim)">Óra: ${row.read}</div></td>
                    <td>${row.cons} kWh <br> <span class="badge ${isOver ? 'badge-piaci' : 'badge-rezsi'}">${isOver ? 'Piaci' : 'Rezsi'}</span></td>
                    <td style="text-align:right; font-weight:800; color:var(--primary)">${row.cost.toLocaleString()} Ft</td>
                </tr>`;
        });

        // Mentés localstorage-ba (csak beállítások)
        const settings = { villanyTotal: vTotal };
        CONFIG.items.forEach(item => settings[item.id] = parseFloat(document.getElementById(`inp_${item.id}`).value));
        localStorage.setItem('pro_settings', JSON.stringify(settings));
    }

    function saveData() {
        const curr = parseFloat(document.getElementById('mvmCurr').value);
        if(!curr) return alert("Írd be az aktuális óraállást!");

        const prev = parseFloat(document.getElementById('mvmPrev').value);
        const cons = curr - prev;
        const rezsiPart = Math.min(cons, CONFIG.limit);
        const piaciPart = Math.max(0, cons - CONFIG.limit);
        const cost = (rezsiPart * CONFIG.rezsiAr) + (piaciPart * CONFIG.piaciAr);

        history.unshift({
            date: document.getElementById('currentDate').innerText,
            read: curr,
            cons: cons,
            cost: Math.round(cost)
        });

        localStorage.setItem('pro_history_v2', JSON.stringify(history));
        document.getElementById('mvmCurr').value = '';
        document.getElementById('mvmPrev').value = curr;
        updateAll();
        alert("Hónap lezárva és mentve!");
    }

    function exportPDF() {
        const element = document.getElementById('app-content');
        const loader = document.getElementById('loader');
        loader.style.display = 'flex';
        
        // PDF-specifikus stílusok aktiválása
        document.body.classList.add('pdf-mode');

        const opt = {
            margin: 10,
            filename: `elszamolas_${new Date().toISOString().slice(0,7)}.pdf`,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2, useCORS: true },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().set(opt).from(element).save().then(() => {
            document.body.classList.remove('pdf-mode');
            loader.style.display = 'none';
        });
    }

    init();
</script>

</body>
</html>
