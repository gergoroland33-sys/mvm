<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rezsi Manager - Eredeti</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
    :root {
        --bg: #0b0f19; --surface: #151e2e; --primary: #3b82f6; --accent: #f59e0b;
        --text: #f1f5f9; --dim: #94a3b8; --border: #1f2937;
        --success: #10b981; --danger: #ef4444;
    }
    * { box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); margin: 0; padding: 0; padding-top: 190px; padding-bottom: 90px; }

    /* --- STICKY DASHBOARD (EZ AZ EREDETI KINÉZET) --- */
    .sticky-dashboard {
        position: fixed; top: 0; left: 0; width: 100%; z-index: 2000;
        background: rgba(11, 15, 25, 0.98); backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--primary); padding: 15px 20px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    }
    .db-top { display: flex; justify-content: space-between; align-items: end; margin-bottom: 5px; }
    .db-big { font-size: 1.4rem; font-weight: 900; color: white; }
    .db-lbl { font-size: 0.65rem; color: var(--dim); font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
    
    .progress-container { position: relative; height: 20px; background: #1f2937; border-radius: 10px; overflow: hidden; margin-top: 10px; border: 1px solid var(--border); }
    .progress-bar { height: 100%; transition: width 0.5s ease; border-right: 2px solid rgba(0,0,0,0.5); }
    
    .time-indicator { 
        position: absolute; top: 0; bottom: 0; width: 2px; background: white; z-index: 10; 
        box-shadow: 0 0 10px white;
    }
    
    .detailed-stats {
        display: flex; justify-content: space-between; font-size: 0.65rem; color: var(--dim); margin-top: 8px;
        background: rgba(255,255,255,0.05); padding: 5px 10px; border-radius: 6px;
    }
    .stat-box strong { display: block; color: white; font-size: 0.75rem; }

    /* --- TABS --- */
    .nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 70px; background: #151e2e; border-top: 1px solid var(--border); display: flex; z-index: 1000; }
    .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--dim); cursor: pointer; transition: 0.2s; border-top: 2px solid transparent; }
    .nav-item.active { color: var(--primary); border-top-color: var(--primary); background: rgba(59,130,246,0.05); }
    .nav-icon { font-size: 1.4rem; margin-bottom: 4px; }
    .nav-lbl { font-size: 0.7rem; font-weight: 800; text-transform: uppercase; }

    /* --- PAGES --- */
    .page { display: none; padding: 20px; animation: fadeIn 0.3s; }
    .page.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* --- CARDS --- */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 15px; margin-bottom: 15px; position: relative; page-break-inside: avoid; }
    .card.active { border: 1px solid var(--primary); background: #1e2837; }
    .c-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .c-title { font-weight: 800; color: white; font-size: 0.9rem; text-transform: uppercase; }
    .c-sub { font-size: 0.65rem; color: var(--dim); font-family: monospace; }

    /* --- INPUTS --- */
    .meter-row { display: flex; justify-content: space-between; align-items: center; gap: 15px; }
    .meter-input { width: 120px; background: #0b0f19; border: 1px solid var(--border); color: white; padding: 10px; border-radius: 8px; font-weight: 700; font-size: 1.1rem; text-align: center; outline: none; font-family: monospace; }
    .meter-input:focus { border-color: var(--accent); }
    .res-box { text-align: right; flex: 1; }
    .res-cost { font-size: 1.3rem; font-weight: 900; color: var(--primary); }
    .res-cons { font-size: 0.75rem; color: var(--dim); }
    .res-alert { color: var(--danger); font-size: 0.7rem; font-weight: bold; display: block; margin-top: 2px; }

    /* --- FAMILY --- */
    .hero { background: linear-gradient(135deg, #1e3a8a, #172554); text-align: center; padding: 25px; border: 1px solid var(--primary); page-break-inside: avoid; }
    .pay-val { color: white; font-size: 2.5rem; font-weight: 900; margin: 10px 0; letter-spacing: -1px; }
    .fix-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px dashed var(--border); }
    .fix-name-in { background: transparent; border: none; color: #cbd5e1; font-size: 0.9rem; width: 100%; font-weight: bold; }
    .fix-val-in { background: #0b0f19; border: 1px solid var(--border); color: white; padding: 5px; border-radius: 6px; text-align: right; width: 90px; font-weight: bold; }
    .fix-del { color: var(--danger); background: none; border: none; font-size: 1.2rem; cursor: pointer; margin-left: 10px; }
    .add-btn { width: 100%; padding: 12px; background: rgba(59, 130, 246, 0.1); color: var(--primary); border: 1px dashed var(--primary); border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 15px; }

    /* --- FAB --- */
    .fab { position: fixed; bottom: 85px; right: 20px; width: 60px; height: 60px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: black; font-size: 1.5rem; box-shadow: 0 10px 30px rgba(0,0,0,0.5); cursor: pointer; z-index: 100; font-weight: bold; }

    /* --- PDF KONTÉNER (Ez a technikai javítás) --- */
    #pdf-temp-container {
        position: fixed; top: 0; left: 0; width: 100%; min-height: 100vh;
        background: #0b0f19; z-index: 9999; display: none; padding: 20px;
        font-family: 'Inter', sans-serif;
    }
    .pdf-mode #pdf-temp-container { display: block; }
    .pdf-mode .sticky-dashboard, .pdf-mode .nav, .pdf-mode .fab, .pdf-mode .page { display: none; }
</style>
</head>
<body>

<div class="sticky-dashboard" id="main-ui-dashboard">
    <div class="db-top">
        <div>
            <div class="db-lbl">ÖSSZ. FOGYASZTÁS</div>
            <div class="db-big" id="d-cons">0.000</div>
        </div>
        <div style="text-align:right">
            <div class="db-lbl">ÉVES KERET (8700)</div>
            <div class="db-big" id="d-rem" style="color:var(--success)">0.000</div>
        </div>
    </div>
    
    <div class="progress-container">
        <div class="progress-bar" id="prog-bar" style="width:0%; background:var(--success)"></div>
        <div class="time-indicator" id="time-mark" style="left:0%"></div>
    </div>
    
    <div class="detailed-stats">
        <div class="stat-box">
            <span>Ideális máig:</span>
            <strong id="stat-ideal">...</strong>
        </div>
        <div class="stat-box" style="text-align:right;">
            <span>Egyenleg:</span>
            <strong id="stat-diff" style="color:white;">...</strong>
        </div>
    </div>
</div>

<div id="page-elec" class="page active">
    <div id="month-list"></div>
</div>

<div id="page-family" class="page">
    <div class="card hero" id="family-hero-card">
        <div style="font-size:0.7rem; color:#bfdbfe; font-weight:800; letter-spacing:2px;">UTALANDÓ (ANYU RÉSZE)</div>
        <div class="pay-val" id="family-total">0 Ft</div>
        <div style="font-size:0.75rem; color:#bfdbfe;">(Villany fele + Fixek 100%)</div>
    </div>

    <div class="card" id="family-fix-card">
        <div class="c-header"><span class="c-title">FIX KÖLTSÉGEK</span></div>
        <div id="fix-container"></div>
        <button class="add-btn" onclick="addFix()">+ ÚJ TÉTEL</button>
    </div>
</div>

<div class="fab" onclick="exportPDF()">📄</div>

<div class="nav">
    <div class="nav-item active" id="nav-elec" onclick="switchTab('elec')">
        <div class="nav-icon">⚡</div>
        <div class="nav-lbl">Áram</div>
    </div>
    <div class="nav-item" id="nav-family" onclick="switchTab('family')">
        <div class="nav-icon">💰</div>
        <div class="nav-lbl">Család</div>
    </div>
</div>

<div id="pdf-temp-container"></div>

<script>
    // --- KONFIGURÁCIÓ ---
    const START_METER = 17232.475; 
    const LIMITS = { mo: 210, yr: 8700 };
    const PRICES = { r: 36.386, p: 70.104 }; 

    const MONTHS = [
        { id: '2025-09', name: '2025. SZEPTEMBER' }, { id: '2025-10', name: '2025. OKTÓBER' },
        { id: '2025-11', name: '2025. NOVEMBER' }, { id: '2025-12', name: '2025. DECEMBER' },
        { id: '2026-01', name: '2026. JANUÁR' }, { id: '2026-02', name: '2026. FEBRUÁR' },
        { id: '2026-03', name: '2026. MÁRCIUS' }, { id: '2026-04', name: '2026. ÁPRILIS' },
        { id: '2026-05', name: '2026. MÁJUS' }, { id: '2026-06', name: '2026. JÚNIUS' },
        { id: '2026-07', name: '2026. JÚLIUS' }, { id: '2026-08', name: '2026. AUGUSZTUS' }
    ];

    const HARDCODED_HISTORY = { '2025-09': 17583.501, '2025-10': 17814.641, '2025-11': 18372.135, '2025-12': 19233.215 };

    // --- STATE ---
    let readings = JSON.parse(localStorage.getItem('v27_readings')) || HARDCODED_HISTORY;
    if (Object.keys(readings).length < Object.keys(HARDCODED_HISTORY).length) { readings = { ...HARDCODED_HISTORY, ...readings }; }
    
    let fixItems = JSON.parse(localStorage.getItem('v27_fixes')) || [
        { name: 'TV Előfizetés', val: 7142 }, { name: 'Telefon', val: 4500 }, { name: 'Internet', val: 2880 },
        { name: 'Víz', val: 2500 }, { name: 'Biztosítás', val: 2386 }, { name: 'Szemét', val: 667 }, { name: 'Adó', val: 600 }
    ];

    let lastCalculatedMvm = 0; 

    function init() { renderMonths(); renderFixes(); calcAll(); }

    function renderMonths() {
        const c = document.getElementById('month-list'); c.innerHTML = '';
        const nowId = new Date().toISOString().slice(0, 7);
        MONTHS.forEach(m => {
            const val = readings[m.id] || '';
            const active = m.id === nowId ? 'active' : '';
            c.innerHTML += `
            <div class="card ${active}" id="c-${m.id}">
                <div class="c-header"><span class="c-title">${m.name}</span><span class="c-sub">NYITÓ: <span id="start-${m.id}">...</span></span></div>
                <div class="meter-row">
                    <input type="number" step="0.001" class="meter-input" placeholder="ZÁRÓ" value="${val}" oninput="updateRead('${m.id}', this.value)">
                    <div class="res-box"><div class="res-cost" id="cost-${m.id}">0 Ft</div><div class="res-cons" id="cons-${m.id}">...</div><div class="res-alert" id="alert-${m.id}"></div></div>
                </div>
            </div>`;
        });
        setTimeout(() => { const el = document.querySelector('.card.active'); if(el) el.scrollIntoView({behavior:"smooth", block:"center"}); }, 500);
    }

    function renderFixes() {
        const c = document.getElementById('fix-container'); c.innerHTML = '';
        fixItems.forEach((item, idx) => {
            c.innerHTML += `
            <div class="fix-row">
                <input type="text" class="fix-name-in" value="${item.name}" oninput="updateFix(${idx}, 'name', this.value)">
                <div style="display:flex; align-items:center;">
                    <input type="number" class="fix-val-in" value="${item.val}" oninput="updateFix(${idx}, 'val', this.value)">
                    <span style="color:#64748b; font-size:0.8rem; margin-left:5px;">Ft</span>
                    <button class="fix-del" onclick="delFix(${idx})">×</button>
                </div>
            </div>`;
        });
    }

    function calcAll() {
        let prev = START_METER; let totalCons = 0; lastCalculatedMvm = 0;
        MONTHS.forEach(m => {
            document.getElementById(`start-${m.id}`).innerText = prev.toFixed(3);
            const curr = readings[m.id];
            const costEl = document.getElementById(`cost-${m.id}`);
            const consEl = document.getElementById(`cons-${m.id}`);
            const alertEl = document.getElementById(`alert-${m.id}`);
            if (curr && curr > prev) {
                let cons = curr - prev; cons = Math.round(cons * 1000) / 1000; totalCons += cons;
                const r = Math.min(cons, LIMITS.mo); const p = Math.max(0, cons - LIMITS.mo);
                const mvm = Math.round((r * PRICES.r) + (p * PRICES.p));
                consEl.innerText = `${cons.toFixed(3)} kWh`; costEl.innerText = `${mvm.toLocaleString()} Ft`;
                alertEl.innerHTML = p > 0 ? `⚠️ ${p.toFixed(3)} kWh túllépés!` : "";
                prev = curr; lastCalculatedMvm = mvm; 
            } else { costEl.innerText = "-"; consEl.innerText = ""; alertEl.innerHTML = ""; if(curr) prev = curr; }
        });
        updateSticky(totalCons); updateFamily();
    }

    function updateSticky(total) {
        const rem = LIMITS.yr - total; const pct = (total / LIMITS.yr) * 100;
        document.getElementById('d-cons').innerText = total.toFixed(3); document.getElementById('d-rem').innerText = rem.toFixed(3);
        const bar = document.getElementById('prog-bar'); const mark = document.getElementById('time-mark');
        bar.style.width = Math.min(pct, 100) + "%";
        const start = new Date('2025-08-31'); const end = new Date('2026-08-31'); const now = new Date();
        const timePct = Math.min(Math.max(((now - start) / (end - start)) * 100, 0), 100);
        mark.style.left = timePct + "%";
        
        // Becslés
        const daysTotal = 365; const daysPassed = Math.floor((now - start) / (1000 * 60 * 60 * 24));
        const idealCons = (LIMITS.yr / daysTotal) * daysPassed;
        const diff = idealCons - total; 
        document.getElementById('stat-ideal').innerText = idealCons.toFixed(0) + " kWh";
        const diffEl = document.getElementById('stat-diff');
        if (diff >= 0) {
            bar.style.background = "var(--success)"; diffEl.innerText = `+${diff.toFixed(0)} kWh (Tartalék)`; diffEl.style.color = "var(--success)";
        } else {
            bar.style.background = "var(--danger)"; diffEl.innerText = `${diff.toFixed(0)} kWh (Túllépés)`; diffEl.style.color = "var(--danger)";
        }
    }

    function updateFamily() {
        let fixSum = 0; fixItems.forEach(i => fixSum += Number(i.val));
        const grand = Math.round(lastCalculatedMvm / 2) + fixSum;
        document.getElementById('family-total').innerText = grand.toLocaleString() + " Ft";
    }

    function updateRead(id, val) { if(val) readings[id] = parseFloat(val); else delete readings[id]; localStorage.setItem('v27_readings', JSON.stringify(readings)); calcAll(); }
    function updateFix(idx, f, v) { fixItems[idx][f] = v; localStorage.setItem('v27_fixes', JSON.stringify(fixItems)); updateFamily(); }
    function addFix() { fixItems.push({ name: 'Új', val: 0 }); renderFixes(); localStorage.setItem('v27_fixes', JSON.stringify(fixItems)); }
    function delFix(idx) { if(confirm("Törlés?")) { fixItems.splice(idx, 1); renderFixes(); localStorage.setItem('v27_fixes', JSON.stringify(fixItems)); updateFamily(); } }
    function switchTab(id) { document.querySelectorAll('.page').forEach(p => p.classList.remove('active')); document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active')); document.getElementById('page-'+id).classList.add('active'); document.getElementById('nav-'+id).classList.add('active'); window.scrollTo(0,0); }

    // --- A JAVÍTOTT PDF RÉSZ ---
    function exportPDF() {
        const container = document.getElementById('pdf-temp-container');
        container.innerHTML = '';
        
        // 1. Klónozás (hogy ugyanúgy nézzen ki)
        const dashClone = document.getElementById('main-ui-dashboard').cloneNode(true);
        dashClone.style.position = 'static'; dashClone.style.marginBottom = '20px';
        container.appendChild(dashClone);

        const familyHero = document.getElementById('family-hero-card').cloneNode(true);
        container.appendChild(familyHero);
        
        const familyFix = document.getElementById('family-fix-card').cloneNode(true);
        familyFix.querySelectorAll('button').forEach(b => b.remove()); // Gombok kuka
        familyFix.querySelectorAll('input').forEach(inp => { // Inputokból szép szöveg
            const sp = document.createElement('span'); 
            sp.innerText = inp.value + (inp.classList.contains('fix-val-in')?' Ft':''); 
            sp.style.color='white'; sp.style.fontWeight='bold';
            inp.parentNode.replaceChild(sp, inp);
        });
        container.appendChild(familyFix);

        const list = document.getElementById('month-list').cloneNode(true);
        list.querySelectorAll('.card').forEach(c => {
            const inp = c.querySelector('input');
            if(!inp.value) c.remove(); // Üreseket ne
            else {
                const sp = document.createElement('span'); sp.innerText = inp.value; sp.style.fontWeight='900'; sp.style.color='white';
                inp.parentNode.replaceChild(sp, inp);
            }
        });
        container.appendChild(list);

        // 2. Generálás (LÁTHATÓ Overlay-ből, hogy ne legyen fehér lap)
        document.body.classList.add('pdf-mode');
        
        const opt = { 
            margin: 0, 
            filename: 'Rezsi_Original_Fix.pdf', 
            image: { type: 'jpeg', quality: 0.98 }, 
            html2canvas: { scale: 2, backgroundColor: '#0b0f19' }, 
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } 
        };

        html2pdf().set(opt).from(container).save().then(() => {
            document.body.classList.remove('pdf-mode');
        });
    }

    init();
</script>
</body>
</html>
