<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Családi Elszámolás Pro - Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --bg: #030712; --card: #111827; --primary: #3b82f6; --accent: #f59e0b;
            --text: #f9fafb; --dim: #9ca3af; --border: #374151; --success: #10b981; --danger: #ef4444;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Inter', system-ui, sans-serif; }
        body { 
            background: var(--bg); color: var(--text); margin: 0; padding: 0;
            overscroll-behavior-y: contain; /* Pull-to-refresh alap */
        }

        /* DASHBOARD CONTAINER */
        .dashboard { padding: 20px; padding-bottom: 100px; max-width: 600px; margin: 0 auto; }

        /* REFRESH GOMB ANIMÁCIÓVAL */
        .refresh-action {
            position: fixed; top: 15px; right: 15px; z-index: 2000;
            background: rgba(59, 130, 246, 0.2); border: 1px solid var(--primary);
            color: var(--primary); width: 45px; height: 45px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            backdrop-filter: blur(10px); transition: 0.3s;
        }
        .refresh-action:active { transform: rotate(180deg) scale(0.9); }

        /* FŐ KÁRTYA - TOTAL */
        .hero-card {
            background: linear-gradient(145deg, #1e40af, #1e3a8a);
            border-radius: 32px; padding: 35px 25px; margin-bottom: 25px;
            position: relative; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .hero-card::after {
            content: ''; position: absolute; top: -50%; right: -50%; width: 200px; height: 200px;
            background: rgba(255,255,255,0.05); border-radius: 50%;
        }
        .hero-label { font-size: 0.75rem; font-weight: 800; letter-spacing: 2px; opacity: 0.7; text-transform: uppercase; }
        .hero-amount { font-size: 3.5rem; font-weight: 900; margin: 10px 0; letter-spacing: -2px; }
        .trend-badge {
            display: inline-flex; align-items: center; gap: 5px; padding: 6px 12px;
            border-radius: 20px; font-size: 0.7rem; font-weight: 700; background: rgba(0,0,0,0.2);
        }

        /* STAT GRID */
        .section-title { font-size: 0.8rem; font-weight: 800; color: var(--dim); margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; display: flex; justify-content: space-between; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .stat-card {
            background: var(--card); border: 1px solid var(--border); border-radius: 24px;
            padding: 20px; position: relative;
        }
        .stat-val { font-size: 1.2rem; font-weight: 800; display: block; margin-top: 5px; }
        .stat-sub { font-size: 0.6rem; color: var(--dim); font-weight: 700; text-transform: uppercase; }

        /* MVM RÉSZLETEZŐ */
        .mvm-box { background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 20px; margin-bottom: 25px; }
        .mvm-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .progress-bar { height: 14px; background: #1f2937; border-radius: 7px; overflow: hidden; display: flex; margin: 15px 0; }
        .bar-r { background: var(--success); box-shadow: 0 0 10px var(--success); }
        .bar-p { background: var(--danger); box-shadow: 0 0 10px var(--danger); }

        /* ELŐZMÉNY LISTA - PRO */
        .history-item {
            background: rgba(255,255,255,0.02); border-radius: 16px; padding: 15px;
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;
            border: 1px solid transparent; transition: 0.2s;
        }
        .history-item:hover { border-color: var(--border); background: rgba(255,255,255,0.05); }
        .hist-date { font-weight: 700; font-size: 0.9rem; }
        .hist-meta { font-size: 0.65rem; color: var(--dim); }
        .hist-price { font-weight: 900; color: var(--primary); text-align: right; }

        /* NAVIGÁCIÓ */
        .nav { position: fixed; bottom: 0; width: 100%; height: 80px; background: rgba(17, 24, 39, 0.9); backdrop-filter: blur(20px); border-top: 1px solid var(--border); display: flex; z-index: 1000; }
        .nav-link { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--dim); text-decoration: none; font-size: 0.65rem; font-weight: 700; gap: 4px; }
        .nav-link.active { color: var(--primary); }
    </style>
</head>
<body>

<div class="refresh-action" onclick="location.reload()">↻</div>

<div class="dashboard">
    <div class="header" style="margin-bottom: 30px;">
        <h2 style="margin:0; font-weight:900; font-size: 1.2rem;">DASHBOARD</h2>
        <span id="dateDisp" style="color:var(--dim); font-size:0.75rem; font-weight:700;">2026. FEBRUÁR</span>
    </div>

    <div class="hero-card">
        <div class="hero-label">Havi fizetendő (Anyu)</div>
        <div class="hero-amount" id="totalHero">0 Ft</div>
        <div class="trend-badge" id="trendDisp">
            <span>--</span> <span>vs előző hónap</span>
        </div>
    </div>

    <div class="section-title">
        <span>Éves Energia Keret (Aug 31)</span>
        <span id="quotaPercent" style="color:var(--primary)">0%</span>
    </div>
    <div class="grid">
        <div class="stat-card">
            <span class="stat-sub">Hátralévő</span>
            <span class="stat-val" id="remQuota">0 kWh</span>
        </div>
        <div class="stat-card">
            <span class="stat-sub">Biztonsági átlag</span>
            <span class="stat-val" id="avgQuota">0 kWh/hó</span>
        </div>
    </div>

    <div class="section-title">MVM Hatékonyság</div>
    <div class="mvm-box">
        <div class="mvm-row">
            <span class="stat-sub">Fogyasztás eloszlása</span>
            <span id="efficiencyVal" style="font-size:0.7rem; font-weight:800; color:var(--success)">EGÉSZSÉGES</span>
        </div>
        <div class="progress-bar">
            <div id="barR" class="bar-r"></div>
            <div id="barP" class="bar-p"></div>
        </div>
        <div class="grid" style="margin-bottom:0; gap:10px;">
            <div style="font-size:0.65rem;">
                <div style="color:var(--success); font-weight:800;">KEDVEZMÉNYES</div>
                <div id="costR">0 Ft</div>
            </div>
            <div style="font-size:0.65rem; text-align:right;">
                <div style="color:var(--danger); font-weight:800;">PIACI ÁRAS</div>
                <div id="costP">0 Ft</div>
            </div>
        </div>
    </div>

    <div class="section-title">Elmúlt időszakok</div>
    <div id="historyList">
        </div>
</div>

<nav class="nav">
    <a href="#" class="nav-link active"><span>📊</span><span>ANALÍZIS</span></a>
    <a href="javascript:alert('Kattints az Adatbevitelre a PDF-ben vagy várd a következő kódot!')" class="nav-link"><span>✏️</span><span>ADATOK</span></a>
    <a href="#" class="nav-link" onclick="window.print()"><span>📤</span><span>PDF</span></a>
</nav>

<script>
    const LIMITS = { monthly: 210, yearly: 8700, pR: 36.386, pP: 70.104 };
    
    // Adat betöltés (Ugyanazokat a neveket használom, hogy megmaradjon az adatod)
    let history = JSON.parse(localStorage.getItem('secure_history_v1')) || [];
    let settings = JSON.parse(localStorage.getItem('expense_settings')) || {};

    function calculateTrend() {
        if (history.length < 2) return "Nincs adat";
        const current = history[0].cost;
        const previous = history[1].cost;
        const diff = current - previous;
        const percent = Math.round((diff / previous) * 100);
        
        const trendEl = document.getElementById('trendDisp');
        if (diff > 0) {
            trendEl.style.color = 'var(--danger)';
            return `▲ +${percent}% emelkedés`;
        } else {
            trendEl.style.color = 'var(--success)';
            return `▼ ${percent}% megtakarítás`;
        }
    }

    function renderDashboard() {
        // 1. Összesített fizetendő (Fixek + MVM utolsó)
        const vShare = Math.round((settings.villanyTotal || 55000) / 2);
        // Itt az összes fix költségedet összeadjuk a settings alapján
        let fixTotal = vShare;
        const fixIds = ['tv','tel','net','viz','bizt','szemet','komm'];
        fixIds.forEach(id => { fixTotal += Math.round(settings[id] || 0); });

        const lastMvmCost = history.length > 0 ? history[0].cost : 0;
        document.getElementById('totalHero').innerText = (fixTotal).toLocaleString() + " Ft";
        document.getElementById('trendDisp').querySelector('span').innerText = calculateTrend();

        // 2. Éves keret
        let totalCons = 0;
        history.forEach(row => totalCons += Math.round(row.cons));
        document.getElementById('remQuota').innerText = (LIMITS.yearly - totalCons).toLocaleString() + " kWh";
        
        const monthsLeft = 8 - (new Date().getMonth());
        const avg = Math.round((LIMITS.yearly - totalCons) / (monthsLeft || 1));
        document.getElementById('avgQuota').innerText = avg.toLocaleString() + " kWh";
        document.getElementById('quotaPercent').innerText = Math.round((totalCons / LIMITS.yearly) * 100) + "%";

        // 3. MVM Bontás (Legutolsó hónap)
        if (history.length > 0) {
            const last = history[0];
            const rP = Math.min(last.cons, LIMITS.monthly);
            const pP = Math.max(0, last.cons - LIMITS.monthly);
            document.getElementById('barR').style.width = (rP / Math.max(last.cons, LIMITS.monthly) * 100) + "%";
            document.getElementById('barP').style.width = (pP / Math.max(last.cons, LIMITS.monthly) * 100) + "%";
            document.getElementById('costR').innerText = Math.round(rP * LIMITS.pR).toLocaleString() + " Ft";
            document.getElementById('costP').innerText = Math.round(pP * LIMITS.pP).toLocaleString() + " Ft";
            
            if (pP > 0) {
                document.getElementById('efficiencyVal').innerText = "PIACI TÚLLÉPÉS";
                document.getElementById('efficiencyVal').style.color = "var(--danger)";
            }
        }

        // 4. Lista render
        const list = document.getElementById('historyList');
        list.innerHTML = '';
        history.forEach((row, index) => {
            list.innerHTML += `
                <div class="history-item">
                    <div>
                        <div class="hist-date">${row.date}</div>
                        <div class="hist-meta">${Math.round(row.cons)} kWh fogyasztás</div>
                    </div>
                    <div class="hist-price">
                        ${Math.round(row.cost).toLocaleString()} Ft
                        <div style="font-size:0.5rem; opacity:0.6;">${Math.round(row.cost / (row.cons || 1))} Ft/kWh</div>
                    </div>
                </div>
            `;
        });
    }

    // Pull-to-refresh szimuláció és érintés
    let touchStart = 0;
    window.addEventListener('touchstart', e => { touchStart = e.touches[0].pageY; });
    window.addEventListener('touchend', e => {
        const touchEnd = e.changedTouches[0].pageY;
        if (touchEnd - touchStart > 150 && window.scrollY === 0) {
            location.reload();
        }
    });

    renderDashboard();
</script>
</body>
</html>
