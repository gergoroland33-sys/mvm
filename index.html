<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Családi Elszámolás Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --bg: #0f172a; --card: #1e293b; --primary: #3b82f6; --accent: #f59e0b;
            --text: #f8fafc; --dim: #94a3b8; --border: #334155; --success: #10b981; --danger: #ef4444;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; padding-bottom: 120px; }

        /* HEADER */
        .header-container { text-align: center; margin-bottom: 25px; }
        h1 { margin: 0; font-size: 1.6rem; font-weight: 900; background: linear-gradient(to right, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { font-size: 0.8rem; color: var(--dim); text-transform: uppercase; letter-spacing: 2px; }

        /* KÁRTYÁK */
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .card-title { font-size: 0.9rem; font-weight: 700; color: var(--dim); text-transform: uppercase; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }

        /* VILLANY ÁTALÁNY */
        .highlight-row { background: rgba(59, 130, 246, 0.1); border: 1px solid var(--primary); border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .hl-label { font-size: 0.8rem; font-weight: 700; color: var(--primary); display: block; margin-bottom: 5px; }
        .hl-input-group { display: flex; justify-content: space-between; align-items: center; }
        .hl-input { background: transparent; border: none; color: white; font-size: 1.5rem; font-weight: 900; width: 120px; text-align: right; outline: none; }
        .hl-input:not([readonly]) { border-bottom: 2px solid var(--primary); }

        /* LISTA */
        .expense-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px dashed rgba(255,255,255,0.1); }
        .ex-input { width: 90px; background: transparent; border: none; color: white; font-weight: 700; text-align: right; font-size: 1rem; outline: none; }
        .ex-input:not([readonly]) { color: var(--accent); border-bottom: 1px solid var(--accent); }

        /* ÖSSZESÍTÉS */
        .total-box { background: linear-gradient(145deg, #1e293b, #0f172a); border: 2px solid var(--accent); border-radius: 20px; padding: 25px; text-align: center; }
        .total-amount { font-size: 2.8rem; font-weight: 900; color: white; text-shadow: 0 0 20px rgba(245, 158, 11, 0.3); }

        /* MVM PROGRESS BAR */
        .mvm-monitor { background: rgba(0,0,0,0.2); border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .bar-container { height: 10px; background: #334155; border-radius: 5px; margin: 10px 0; overflow: hidden; display: flex; }
        .bar-fill-rezsi { background: var(--success); height: 100%; transition: 0.3s; }
        .bar-fill-piaci { background: var(--danger); height: 100%; transition: 0.3s; }
        .bar-labels { display: flex; justify-content: space-between; font-size: 0.7rem; font-weight: bold; }

        /* TÁBLÁZAT */
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th { text-align: left; color: var(--dim); padding: 8px; font-size: 0.7rem; text-transform: uppercase; }
        td { padding: 10px 8px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .cost-col { font-weight: 800; text-align: right; color: var(--primary); }

        /* GOMBOK */
        .fab-group { position: fixed; bottom: 20px; left: 0; right: 0; display: flex; justify-content: center; gap: 15px; z-index: 100; }
        .btn { background: var(--card); border: 1px solid var(--border); color: white; padding: 14px 24px; border-radius: 50px; font-weight: 700; cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
        .btn-primary { background: var(--primary); border: none; }

        /* PDF STÍLUS */
        .pdf-mode { background: white !important; color: #1e293b !important; padding: 20px !important; }
        .pdf-mode .card { box-shadow: none !important; border: 1px solid #ccc !important; background: #fff !important; color: #000 !important; }
        .pdf-mode .total-box { border-color: #000 !important; color: #000 !important; }
        .pdf-mode .total-amount { color: #000 !important; }
        .pdf-mode .fab-group, .pdf-mode .edit-btn, .pdf-mode .mvm-inputs { display: none !important; }
    </style>
</head>
<body>

<div id="contentToExport">
    <div class="header-container">
        <h1>CSALÁDI ELSZÁMOLÁS</h1>
        <div class="subtitle" id="currentMonthDate">2026. JANUÁR</div>
    </div>

    <div class="card">
        <div class="card-title">
            <span>💰 HAVI KÖLTSÉGEK</span>
            <button class="btn" style="padding: 5px 10px; font-size: 0.7rem;" id="editBtn" onclick="toggleEdit()">🔒 LEZÁRVA</button>
        </div>

        <div class="highlight-row">
            <span class="hl-label">VILLANY ÁTALÁNY (TELJES)</span>
            <div class="hl-input-group">
                <span>Összeg:</span>
                <input type="number" id="villanyTotal" class="hl-input" value="55000" readonly oninput="updateAll()">
            </div>
            <div style="font-size: 0.8rem; margin-top: 5px;">Anyu része (50%): <strong id="villanyHalf" style="color:var(--primary)">27 500 Ft</strong></div>
        </div>

        <div id="expenseList"></div>
    </div>

    <div class="card">
        <div class="total-box">
            <div style="color: var(--accent); font-weight: 800; font-size: 0.9rem;">UTALANDÓ ÖSSZEG (ANYU)</div>
            <div class="total-amount" id="grandTotal">0 Ft</div>
        </div>
    </div>

    <div class="card">
        <div class="card-title">📝 MVM MONITORING</div>
        
        <div class="mvm-inputs" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px;">
            <div>
                <label style="font-size: 0.7rem; color: var(--dim);">Előző állás</label>
                <input type="number" id="mvmPrev" readonly style="width:100%; background:transparent; border:1px solid var(--border); color:white; padding:8px; border-radius:8px;">
            </div>
            <div>
                <label style="font-size: 0.7rem; color: var(--dim);">Jelenlegi állás</label>
                <input type="number" id="mvmCurr" oninput="updateAll()" style="width:100%; background:rgba(59,130,246,0.1); border:1px solid var(--primary); color:white; padding:8px; border-radius:8px;">
            </div>
        </div>

        <div class="mvm-monitor">
            <div class="bar-labels">
                <span id="txtRezsi">Rezsi: 0 kWh</span>
                <span id="txtPiaci">Piaci: 0 kWh</span>
            </div>
            <div class="bar-container">
                <div id="barRezsi" class="bar-fill-rezsi" style="width: 0%"></div>
                <div id="barPiaci" class="bar-fill-piaci" style="width: 0%"></div>
            </div>
            <div style="text-align: right; font-weight: 800; color: var(--success);" id="liveCost">0 Ft</div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Dátum</th>
                    <th>Fogyasztás</th>
                    <th style="text-align:right">Összeg</th>
                </tr>
            </thead>
            <tbody id="historyBody"></tbody>
        </table>
    </div>
</div>

<div class="fab-group">
    <button class="btn" onclick="saveData()">💾 MENTÉS</button>
    <button class="btn btn-primary" onclick="sharePDF()">📤 PDF KÜLDÉS</button>
</div>

<script>
    const ITEMS = [
        { id: 'tv', name: 'TV Előfizetés', val: 7142 },
        { id: 'tel', name: 'Telefon', val: 4500 },
        { id: 'net', name: 'Internet', val: 2880 },
        { id: 'viz', name: 'Vízdíj', val: 2500 },
        { id: 'bizt', name: 'Biztosítás', val: 2386 },
        { id: 'szemet', name: 'Szemét díj', val: 667 },
        { id: 'komm', name: 'Kommunális adó', val: 600 }
    ];
    const LIMIT = 210; const P_REZSI = 36.386; const P_PIACI = 70.104;

    let isEditing = false;
    let savedInputs = JSON.parse(localStorage.getItem('expense_settings')) || {};
    let historyLog = JSON.parse(localStorage.getItem('secure_history_v1')) || [];

    function init() {
        const monthNames = ["JANUÁR","FEBRUÁR","MÁRCIUS","ÁPRILIS","MÁJUS","JÚNIUS","JÚLIUS","AUGUSZTUS","SZEPTEMBER","OKTÓBER","NOVEMBER","DECEMBER"];
        const now = new Date();
        document.getElementById('currentMonthDate').innerText = `${now.getFullYear()}. ${monthNames[now.getMonth()]}`;
        
        document.getElementById('villanyTotal').value = savedInputs['villanyTotal'] || 55000;
        
        const list = document.getElementById('expenseList');
        ITEMS.forEach(item => {
            const val = savedInputs[item.id] !== undefined ? savedInputs[item.id] : item.val;
            list.innerHTML += `
                <div class="expense-item">
                    <span>${item.name}</span>
                    <div>
                        <input type="number" class="ex-input" id="inp_${item.id}" value="${val}" readonly oninput="updateAll()">
                        <span style="font-size:0.7rem; color:var(--dim)">Ft</span>
                    </div>
                </div>`;
        });

        if(historyLog.length > 0) {
            document.getElementById('mvmPrev').value = historyLog[0].read;
        } else {
            document.getElementById('mvmPrev').value = 18372; // Alapértelmezett kezdő érték
        }
        updateAll();
    }

    function toggleEdit() {
        isEditing = !isEditing;
        const btn = document.getElementById('editBtn');
        const inputs = document.querySelectorAll('.ex-input, #villanyTotal');
        btn.innerText = isEditing ? '🔓 SZERKESZTHETŐ' : '🔒 LEZÁRVA';
        inputs.forEach(i => i.readOnly = !isEditing);
    }

    function updateAll() {
        const vTot = parseFloat(document.getElementById('villanyTotal').value) || 0;
        const vShare = vTot / 2;
        document.getElementById('villanyHalf').innerText = vShare.toLocaleString() + " Ft";

        let others = 0;
        ITEMS.forEach(item => {
            others += parseFloat(document.getElementById(`inp_${item.id}`).value) || 0;
        });

        document.getElementById('grandTotal').innerText = Math.round(vShare + others).toLocaleString() + " Ft";

        // MVM Matek
        const curr = parseFloat(document.getElementById('mvmCurr').value) || 0;
        const prev = parseFloat(document.getElementById('mvmPrev').value) || 0;
        
        if(curr > prev) {
            const cons = curr - prev;
            const rPart = Math.min(cons, LIMIT);
            const pPart = Math.max(0, cons - LIMIT);
            const cost = (rPart * P_REZSI) + (pPart * P_PIACI);

            document.getElementById('barRezsi').style.width = (rPart / Math.max(cons, LIMIT) * 100) + "%";
            document.getElementById('barPiaci').style.width = (pPart / Math.max(cons, LIMIT) * 100) + "%";
            document.getElementById('txtRezsi').innerText = `Rezsi: ${Math.round(rPart)} kWh`;
            document.getElementById('txtPiaci').innerText = `Piaci: ${Math.round(pPart)} kWh`;
            document.getElementById('liveCost').innerText = Math.round(cost).toLocaleString() + " Ft";
        }

        // Táblázat render
        const tbody = document.getElementById('historyBody');
        tbody.innerHTML = '';
        historyLog.slice(0, 5).forEach(row => {
            tbody.innerHTML += `
                <tr>
                    <td>${row.date}</td>
                    <td>${row.cons} kWh ${row.cons > LIMIT ? '⚠️' : ''}</td>
                    <td class="cost-col">${Math.round(row.cost).toLocaleString()} Ft</td>
                </tr>`;
        });

        // Mentés (Beállítások)
        let toSave = { villanyTotal: vTot };
        ITEMS.forEach(item => toSave[item.id] = parseFloat(document.getElementById(`inp_${item.id}`).value));
        localStorage.setItem('expense_settings', JSON.stringify(toSave));
    }

    function saveData() {
        const curr = parseFloat(document.getElementById('mvmCurr').value);
        const prev = parseFloat(document.getElementById('mvmPrev').value);
        if(!curr || curr <= prev) return alert("Hiba: Adj meg egy érvényes, magasabb óraállást!");

        const cons = curr - prev;
        const cost = (Math.min(cons, LIMIT) * P_REZSI) + (Math.max(0, cons - LIMIT) * P_PIACI);
        
        historyLog.unshift({
            date: document.getElementById('currentMonthDate').innerText,
            read: curr,
            cons: cons,
            cost: cost
        });

        localStorage.setItem('secure_history_v1', JSON.stringify(historyLog));
        document.getElementById('mvmPrev').value = curr;
        document.getElementById('mvmCurr').value = '';
        updateAll();
        alert("Sikeresen mentve az előzményekbe!");
    }

    function sharePDF() {
        const el = document.getElementById('contentToExport');
        document.body.classList.add('pdf-mode');
        
        const opt = {
            margin: 10,
            filename: 'Havi_Elszamolas.pdf',
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2 },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().set(opt).from(el).save().then(() => {
            document.body.classList.remove('pdf-mode');
        });
    }

    init();
</script>
</body>
</html>
