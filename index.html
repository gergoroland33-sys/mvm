<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Családi Rezsi Manager v23</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
    :root {
        --bg: #0b0f19; --surface: #151e2e; --primary: #3b82f6; --accent: #f59e0b;
        --text: #f1f5f9; --dim: #64748b; --border: #1f2937;
        --success: #10b981; --danger: #ef4444;
    }
    * { box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); margin: 0; padding: 0; padding-top: 140px; padding-bottom: 90px; }

    /* --- STICKY HEADER (MINDIG LÁTHATÓ) --- */
    .sticky-dashboard {
        position: fixed; top: 0; left: 0; width: 100%; z-index: 2000;
        background: rgba(11, 15, 25, 0.95); backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--primary); padding: 15px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.5);
    }
    .db-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: end; }
    .db-label { font-size: 0.65rem; color: var(--dim); font-weight: 800; text-transform: uppercase; }
    .db-val { font-size: 1.2rem; font-weight: 900; color: white; line-height: 1; }
    
    .progress-track { 
        height: 12px; background: #1f2937; border-radius: 6px; overflow: hidden; 
        position: relative; margin-top: 10px; border: 1px solid var(--border); 
    }
    /* Csíkos animáció */
    .progress-fill { 
        height: 100%; transition: width 0.5s ease; 
        background-image: linear-gradient(45deg,rgba(255,255,255,.15) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.15) 50%,rgba(255,255,255,.15) 75%,transparent 75%,transparent);
        background-size: 1rem 1rem;
    }
    .time-marker { position: absolute; top: 0; bottom: 0; width: 3px; background: white; z-index: 10; box-shadow: 0 0 8px white; }
    
    .status-msg { font-size: 0.7rem; text-align: center; margin-top: 5px; font-weight: 700; color: var(--dim); }

    /* --- TAB NAVIGATION --- */
    .nav {
        position: fixed; bottom: 0; left: 0; width: 100%; height: 70px;
        background: #151e2e; border-top: 1px solid var(--border); display: flex; z-index: 1000;
    }
    .nav-item {
        flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
        color: var(--dim); cursor: pointer; transition: 0.2s; border-top: 2px solid transparent;
    }
    .nav-item.active { color: var(--primary); border-top-color: var(--primary); background: rgba(59,130,246,0.05); }
    .nav-icon { font-size: 1.4rem; margin-bottom: 4px; }
    .nav-lbl { font-size: 0.7rem; font-weight: 800; text-transform: uppercase; }

    /* --- PAGES --- */
    .page { display: none; padding: 20px; animation: fadeIn 0.3s; }
    .page.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* --- CARDS --- */
    .card {
        background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
        padding: 15px; margin-bottom: 15px; position: relative;
    }
    .card.active { border: 1px solid var(--primary); background: #1e2837; }
    
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .c-title { font-weight: 800; color: white; font-size: 0.9rem; text-transform: uppercase; }
    .c-sub { font-size: 0.65rem; color: var(--dim); }

    /* --- ÁRAM INPUTOK --- */
    .meter-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 15px; align-items: center; }
    .meter-input {
        width: 100%; background: #0b0f19; border: 1px solid var(--border); color: white;
        padding: 12px; border-radius: 8px; font-weight: 700; font-size: 1.1rem; text-align: center; outline: none;
        font-family: monospace;
    }
    .meter-input:focus { border-color: var(--accent); }
    
    .res-box { text-align: right; }
    .res-cost { font-size: 1.2rem; font-weight: 900; color: var(--primary); }
    .res-cons { font-size: 0.75rem; color: var(--dim); }

    /* --- CSALÁDI KASSZA --- */
    .hero { background: linear-gradient(135deg, #1e3a8a, #172554); text-align: center; padding: 25px; border: 1px solid var(--primary); }
    .pay-lbl { color: #93c5fd; font-size: 0.7rem; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; }
    .pay-val { color: white; font-size: 2.5rem; font-weight: 900; margin: 10px 0; letter-spacing: -1px; }
    .pay-det { background: rgba(0,0,0,0.2); padding: 5px 10px; border-radius: 20px; font-size: 0.7rem; color: #bfdbfe; display: inline-block; }

    /* --- FIX SZERKESZTŐ --- */
    .edit-mode-btn { 
        width: 100%; background: var(--surface); border: 1px solid var(--border); padding: 12px; 
        color: var(--accent); font-weight: 800; font-size: 0.8rem; border-radius: 12px; 
        margin-bottom: 15px; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
    }
    
    .fix-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px dashed var(--border); }
    .fix-left { font-size: 0.9rem; color: #cbd5e1; }
    .fix-right { font-weight: 700; color: white; }

    .fix-edit-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
    .fix-in-name { flex: 2; background: #0b0f19; border: 1px solid var(--border); color: white; padding: 8px; border-radius: 6px; }
    .fix-in-val { flex: 1; background: #0b0f19; border: 1px solid var(--border); color: white; padding: 8px; border-radius: 6px; text-align: right; }
    .del-btn { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: none; padding: 8px; border-radius: 6px; cursor: pointer; }
    
    .add-btn { width: 100%; background: rgba(16, 185, 129, 0.1); color: var(--success); border: 1px dashed var(--success); padding: 10px; border-radius: 8px; margin-top: 10px; font-weight: bold; cursor: pointer; }

    /* TOOLS */
    .tools-area { text-align: center; margin-top: 30px; border-top: 1px solid var(--border); padding-top: 20px; }
    .backup-btn { background: none; border: 1px solid var(--dim); color: var(--dim); padding: 5px 10px; border-radius: 6px; font-size: 0.7rem; cursor: pointer; margin: 0 5px; }

    /* PDF FAB */
    .fab { position: fixed; bottom: 85px; right: 20px; width: 55px; height: 55px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 1.5rem; box-shadow: 0 10px 20px rgba(0,0,0,0.5); cursor: pointer; z-index: 100; }

    /* PDF MODE */
    .pdf-mode { background: white !important; color: black !important; padding: 40px !important; padding-top: 20px !important; }
    .pdf-mode .sticky-dashboard, .pdf-mode .nav, .pdf-mode .fab, .pdf-mode .tools-area, .pdf-mode .add-btn, .pdf-mode .del-btn { display: none !important; }
    .pdf-mode .card, .pdf-mode .hero { background: white !important; border: 1px solid #ccc !important; box-shadow: none !important; color: black !important; page-break-inside: avoid; }
    .pdf-mode .hero { background: #f0f9ff !important; border-color: #3b82f6 !important; }
    .pdf-mode .meter-input, .pdf-mode .fix-in-name, .pdf-mode .fix-in-val { border: none !important; background: transparent !important; color: black !important; font-weight: 900 !important; }
    .pdf-mode .pay-val { color: #1e3a8a !important; }
</style>
</head>
<body>

<div class="sticky-dashboard">
    <div class="db-grid">
        <div>
            <div class="db-label">FOGYASZTÁS (SZEPT 1-TŐL)</div>
            <div class="db-val" id="d-cons">0.000 kWh</div>
        </div>
        <div style="text-align:right">
            <div class="db-label">ÉVES KERET (8700)</div>
            <div class="db-val" id="d-rem" style="color:var(--success)">0.000 kWh</div>
        </div>
    </div>
    
    <div class="progress-track">
        <div class="progress-fill" id="prog-bar" style="width:0%; background:var(--success)"></div>
        <div class="time-marker" id="time-marker" style="left:0%"></div>
    </div>
    <div class="status-msg" id="status-msg">Számítás...</div>
</div>

<div id="page-elec" class="page active">
    <h2 style="text-align:center; color:white; margin-bottom:20px;">⚡ MVM ÁRAM NAPLÓ</h2>
    <div id="month-list"></div>
</div>

<div id="page-family" class="page">
    <h2 style="text-align:center; color:white; margin-bottom:20px;">💰 CSALÁDI ELSZÁMOLÁS</h2>
    
    <div class="card hero">
        <div class="pay-lbl">UTALANDÓ (ANYU RÉSZE)</div>
        <div class="pay-val" id="family-total">0 Ft</div>
        <div class="pay-det" id="family-breakdown">...</div>
    </div>

    <div onclick="toggleEdit()" class="edit-mode-btn">
        <span>🛠️ FIX KÖLTSÉGEK SZERKESZTÉSE</span>
        <span>▼</span>
    </div>
    
    <div class="card" id="fix-container">
        <div id="fix-list-area"></div>
        
        <div id="editor-controls" style="display:none; border-top:1px dashed var(--border); padding-top:15px; margin-top:15px;">
            <button class="add-btn" onclick="addFixItem()">+ ÚJ TÉTEL HOZZÁADÁSA</button>
        </div>
    </div>

    <div class="tools-area">
        <button class="backup-btn" onclick="exportData()">💾 Mentés Fájlba</button>
        <button class="backup-btn" onclick="document.getElementById('file-input').click()">📂 Visszatöltés</button>
        <button class="backup-btn" style="color:var(--danger); border-color:var(--danger);" onclick="resetAll()">⚠️ Törlés</button>
        <input type="file" id="file-input" style="display:none" onchange="importData(this)">
    </div>
</div>

<div class="fab" onclick="genPDF()">📄</div>

<div class="nav">
    <div class="nav-item active" id="nav-elec" onclick="switchTab('elec')">
        <div class="nav-icon">⚡</div>
        <div class="nav-lbl">Áram</div>
    </div>
    <div class="nav-item" id="nav-family" onclick="switchTab('family')">
        <div class="nav-icon">👨‍👩‍👦</div>
        <div class="nav-lbl">Család</div>
    </div>
</div>

<script>
    // --- KONFIGURÁCIÓ ---
    // Start: Augusztus végi záró (Szept 1. nyitó)
    const START_METER = 17232.475; 
    const LIMITS = { mo: 210, yr: 8700 };
    const PRICES = { r: 36.386, p: 70.104 }; 

    const MONTHS = [
        { id: '2025-09', name: '2025. SZEPTEMBER' },
        { id: '2025-10', name: '2025. OKTÓBER' },
        { id: '2025-11', name: '2025. NOVEMBER' },
        { id: '2025-12', name: '2025. DECEMBER' },
        { id: '2026-01', name: '2026. JANUÁR' },
        { id: '2026-02', name: '2026. FEBRUÁR' },
        { id: '2026-03', name: '2026. MÁRCIUS' },
        { id: '2026-04', name: '2026. ÁPRILIS' },
        { id: '2026-05', name: '2026. MÁJUS' },
        { id: '2026-06', name: '2026. JÚNIUS' },
        { id: '2026-07', name: '2026. JÚLIUS' },
        { id: '2026-08', name: '2026. AUGUSZTUS' }
    ];

    // Alapértelmezett Fixek (Ha üres a tároló)
    const DEFAULT_FIXES = [
        { name: 'TV Előfizetés', val: 7142 },
        { name: 'Telefon', val: 4500 },
        { name: 'Internet', val: 2880 },
        { name: 'Víz', val: 2500 },
        { name: 'Biztosítás', val: 2386 },
        { name: 'Szemét', val: 667 },
        { name: 'Adó', val: 600 }
    ];

    // --- STATE ---
    // Betöltés CSV adatokkal, ha nincs mentés
    let readings = JSON.parse(localStorage.getItem('v23_readings')) || {
        '2025-09': 17583.501,
        '2025-10': 17814.641,
        '2025-11': 18372.135,
        '2025-12': 19233.215
    };
    
    let fixItems = JSON.parse(localStorage.getItem('v23_fixes')) || [...DEFAULT_FIXES];
    let isEditing = false;
    let lastValidMonthCost = 0; // A Családi kasszához

    // --- INIT ---
    function init() {
        renderMonths();
        renderFixes();
        calcAll();
    }

    // --- RENDER ÁRAM ---
    function renderMonths() {
        const c = document.getElementById('month-list');
        c.innerHTML = '';
        const nowId = new Date().toISOString().slice(0, 7);

        MONTHS.forEach(m => {
            const val = readings[m.id] || '';
            const active = m.id === nowId ? 'active' : '';
            c.innerHTML += `
            <div class="card ${active}" id="c-${m.id}">
                <div class="card-header">
                    <span class="c-title">${m.name}</span>
                    <span class="c-sub">NYITÓ: <span id="start-${m.id}">...</span></span>
                </div>
                <div class="meter-grid">
                    <div>
                        <input type="number" step="0.001" class="meter-input" placeholder="Záró állás" 
                            value="${val}" oninput="saveRead('${m.id}', this.value)">
                    </div>
                    <div class="res-box">
                        <div class="res-cost" id="cost-${m.id}">0 Ft</div>
                        <div class="res-cons" id="cons-${m.id}">...</div>
                    </div>
                </div>
                <div id="msg-${m.id}" style="font-size:0.65rem; color:var(--dim); margin-top:5px; border-top:1px dashed var(--border); padding-top:5px;"></div>
            </div>`;
        });
        
        setTimeout(() => {
            const el = document.querySelector('.card.active');
            if(el) el.scrollIntoView({behavior:"smooth", block:"center"});
        }, 500);
    }

    // --- RENDER FIXEK ---
    function renderFixes() {
        const area = document.getElementById('fix-list-area');
        area.innerHTML = '';
        
        let total = 0;
        
        fixItems.forEach((item, index) => {
            total += Number(item.val);
            
            if (isEditing) {
                // Szerkesztő nézet
                area.innerHTML += `
                <div class="fix-edit-row">
                    <input type="text" class="fix-in-name" value="${item.name}" onchange="updateFix(${index}, 'name', this.value)">
                    <input type="number" class="fix-in-val" value="${item.val}" onchange="updateFix(${index}, 'val', this.value)">
                    <button class="del-btn" onclick="deleteFix(${index})">🗑️</button>
                </div>`;
            } else {
                // Sima nézet
                area.innerHTML += `
                <div class="fix-item">
                    <span class="fix-left">${item.name}</span>
                    <span class="fix-right">${Number(item.val).toLocaleString()} Ft</span>
                </div>`;
            }
        });
        
        if(!isEditing) {
            area.innerHTML += `
            <div style="text-align:right; margin-top:10px; padding-top:10px; border-top:2px solid var(--border); font-weight:900; color:white; font-size:1.1rem;">
                ÖSSZESEN: ${total.toLocaleString()} Ft
            </div>`;
        }
        
        updateFamilyTotal(); // Frissíti a főösszeget is
    }

    // --- SZÁMÍTÁS (CORE) ---
    function calcAll() {
        let prev = START_METER;
        let totalCons = 0;
        lastValidMonthCost = 0;

        MONTHS.forEach(m => {
            document.getElementById(`start-${m.id}`).innerText = prev.toFixed(3);
            const curr = readings[m.id];
            
            const costEl = document.getElementById(`cost-${m.id}`);
            const consEl = document.getElementById(`cons-${m.id}`);
            const msgEl = document.getElementById(`msg-${m.id}`);

            if (curr && curr > prev) {
                let cons = curr - prev;
                cons = Math.round(cons * 1000) / 1000;
                totalCons += cons;

                // MVM Matek
                const r = Math.min(cons, LIMITS.mo);
                const p = Math.max(0, cons - LIMITS.mo);
                const mvmCost = Math.round((r * PRICES.r) + (p * PRICES.p));
                
                // Megjelenítés
                consEl.innerText = `${cons.toFixed(3)} kWh`;
                costEl.innerText = `${mvmCost.toLocaleString()} Ft`;
                
                let msg = p > 0 ? `<span style="color:var(--danger)">⚠️ ${p.toFixed(1)} kWh túllépés!</span>` : `<span style="color:var(--success)">✔️ Kereten belül.</span>`;
                msgEl.innerHTML = msg;

                prev = curr;
                lastValidMonthCost = mvmCost; // Ez kell a Családi fülhöz
            } else {
                consEl.innerText = "-";
                costEl.innerText = "-";
                msgEl.innerHTML = "";
                if(curr) prev = curr; 
            }
        });

        // Sticky Header Update
        updateStickyHeader(totalCons);
        updateFamilyTotal();
    }

    function updateStickyHeader(total) {
        const rem = LIMITS.yr - total;
        const pct = (total / LIMITS.yr) * 100;
        
        document.getElementById('d-cons').innerText = total.toFixed(3) + " kWh";
        document.getElementById('d-rem').innerText = rem.toFixed(3) + " kWh";
        document.getElementById('prog-bar').style.width = Math.min(pct, 100) + "%";
        
        // Idővonal
        const start = new Date('2025-08-31');
        const end = new Date('2026-08-31');
        const now = new Date();
        const tPct = ((now - start) / (end - start)) * 100;
        
        document.getElementById('time-marker').style.left = Math.min(Math.max(tPct,0),100) + "%";
        
        const stMsg = document.getElementById('status-msg');
        const bar = document.getElementById('prog-bar');
        
        if(pct > tPct) {
            bar.style.background = "var(--danger)";
            stMsg.innerHTML = "<span style='color:var(--danger)'>TÚLFOGYASZTÁS!</span> A csík megelőzte az időt.";
        } else {
            bar.style.background = "var(--success)";
            stMsg.innerHTML = "<span style='color:var(--success)'>RENDBEN.</span> Van tartalékod.";
        }
    }

    function updateFamilyTotal() {
        const mvmHalf = Math.round(lastValidMonthCost / 2);
        let fixTotal = fixItems.reduce((acc, item) => acc + Number(item.val), 0);
        
        const grand = mvmHalf + fixTotal;
        
        document.getElementById('family-total').innerText = grand.toLocaleString() + " Ft";
        document.getElementById('family-breakdown').innerText = `MVM FELE (${mvmHalf}) + FIXEK (${fixTotal})`;
    }

    // --- ADATKEZELÉS ---
    function saveRead(id, val) {
        if(val) readings[id] = parseFloat(val);
        else delete readings[id];
        localStorage.setItem('v23_readings', JSON.stringify(readings));
        calcAll();
    }

    function toggleEdit() {
        isEditing = !isEditing;
        document.getElementById('editor-controls').style.display = isEditing ? 'block' : 'none';
        renderFixes();
    }

    function updateFix(idx, field, val) {
        fixItems[idx][field] = val;
        saveFixes();
    }

    function deleteFix(idx) {
        if(confirm("Biztosan törlöd ezt a tételt?")) {
            fixItems.splice(idx, 1);
            saveFixes();
            renderFixes();
        }
    }

    function addFixItem() {
        fixItems.push({ name: 'Új Tétel', val: 0 });
        saveFixes();
        renderFixes();
    }

    function saveFixes() {
        localStorage.setItem('v23_fixes', JSON.stringify(fixItems));
        updateFamilyTotal();
    }

    // --- NAVIGÁCIÓ ---
    function switchTab(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById('page-'+id).classList.add('active');
        document.getElementById('nav-'+id).classList.add('active');
        window.scrollTo(0,0);
    }

    // --- BIZTONSÁG ---
    function exportData() {
        const data = { r: readings, f: fixItems };
        const blob = new Blob([JSON.stringify(data)], {type: "application/json"});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = "rezsi_mentes.json";
        a.click();
    }

    function importData(input) {
        const file = input.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                readings = data.r;
                fixItems = data.f;
                localStorage.setItem('v23_readings', JSON.stringify(readings));
                localStorage.setItem('v23_fixes', JSON.stringify(fixItems));
                location.reload();
            } catch(err) { alert("Hibás fájl!"); }
        };
        reader.readAsText(file);
    }

    function resetAll() {
        if(confirm("MINDEN ADAT VÉGLEGES TÖRLÉSE?")) {
            localStorage.clear();
            location.reload();
        }
    }

    function genPDF() {
        document.body.classList.add('pdf-mode');
        document.getElementById('page-elec').style.display = 'block';
        document.getElementById('page-family').style.display = 'block';
        
        const opt = { margin: 5, filename: 'Rezsi_Manager_Pro.pdf', image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } };
        html2pdf().set(opt).from(document.body).save().then(() => {
            document.body.classList.remove('pdf-mode');
            location.reload();
        });
    }

    init();
</script>
</body>
</html>
