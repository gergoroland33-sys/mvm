<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Éves Rezsi Tervező Pro</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
    :root {
        --bg: #050b14; --card: #111827; --primary: #3b82f6; --accent: #f59e0b;
        --text: #f1f5f9; --dim: #64748b; --border: #1f2937;
        --success: #10b981; --danger: #ef4444; --warning: #f59e0b;
    }
    * { box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); margin: 0; padding: 10px; padding-bottom: 100px; }

    /* HEADER */
    .header-box { text-align: center; margin-bottom: 20px; padding: 20px 0; }
    h1 { margin: 0; font-size: 1.4rem; background: linear-gradient(to right, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; letter-spacing: -0.5px; }
    
    /* ÉVES PROGNÓZIS DASHBOARD (STICKY) */
    .dashboard-sticky {
        position: sticky; top: 10px; z-index: 100;
        background: rgba(17, 24, 39, 0.95); backdrop-filter: blur(10px);
        border: 1px solid var(--primary); border-radius: 16px; padding: 15px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-bottom: 25px;
    }
    .db-row { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 10px; }
    .db-label { font-size: 0.7rem; color: var(--dim); font-weight: 800; text-transform: uppercase; }
    .db-val { font-size: 1.5rem; font-weight: 900; color: white; line-height: 1; }
    
    /* PROGRESS BAR */
    .progress-track { height: 8px; background: #1f2937; border-radius: 4px; overflow: hidden; position: relative; }
    .progress-fill { height: 100%; transition: width 0.5s ease; border-radius: 4px; }
    .marker { position: absolute; top: 0; bottom: 0; width: 2px; background: white; z-index: 2; opacity: 0.5; }
    
    /* FIX KÖLTSÉG BEÁLLÍTÁS */
    .settings-btn { width: 100%; background: var(--card); border: 1px solid var(--border); padding: 10px; color: var(--dim); font-size: 0.8rem; border-radius: 12px; margin-bottom: 20px; cursor: pointer; }

    /* HÓNAP KÁRTYÁK */
    .month-list { display: flex; flex-direction: column; gap: 15px; }
    .month-card { 
        background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 15px; 
        transition: 0.3s; position: relative; overflow: hidden;
    }
    .month-card.active { border-color: var(--primary); background: #162032; }
    .month-card.future { opacity: 0.6; }

    .mc-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .mc-name { font-weight: 800; font-size: 0.95rem; color: white; text-transform: uppercase; }
    .mc-status { font-size: 0.7rem; padding: 3px 8px; border-radius: 6px; font-weight: 700; }
    .st-ok { background: rgba(16, 185, 129, 0.2); color: var(--success); }
    .st-bad { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
    
    .mc-grid { display: grid; grid-template-columns: 1fr 1.5fr; gap: 15px; align-items: center; }
    
    /* ÓRAÁLLÁS INPUT */
    .reading-input-group label { display: block; font-size: 0.65rem; color: var(--dim); font-weight: 800; margin-bottom: 4px; }
    .reading-input { 
        width: 100%; background: #050b14; border: 1px solid var(--border); color: white; 
        padding: 12px; border-radius: 10px; font-weight: 700; font-size: 1.1rem; outline: none;
    }
    .reading-input:focus { border-color: var(--accent); }

    /* EREDMÉNYEK */
    .result-box { text-align: right; }
    .cons-val { font-size: 0.9rem; color: var(--accent); font-weight: 700; margin-bottom: 2px; }
    .cost-val { font-size: 1.3rem; font-weight: 900; color: white; }
    .cost-sub { font-size: 0.7rem; color: var(--dim); }

    /* PDF FAB */
    .fab { position: fixed; bottom: 20px; right: 20px; width: 50px; height: 50px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; box-shadow: 0 10px 20px rgba(0,0,0,0.5); cursor: pointer; z-index: 1000; font-size: 1.5rem; }

    /* PDF MODE */
    .pdf-mode { background: white !important; color: black !important; padding: 20px !important; }
    .pdf-mode .dashboard-sticky, .pdf-mode .month-card { background: white !important; border: 1px solid #ccc !important; box-shadow: none !important; color: black !important; page-break-inside: avoid; }
    .pdf-mode input { border: none !important; background: transparent !important; color: black !important; font-weight: bold; }
    .pdf-mode .fab, .pdf-mode .settings-btn { display: none !important; }
</style>
</head>
<body>

<div class="header-box">
    <h1>ÉVES TERVEZŐ 2025/26</h1>
    <div style="font-size:0.8rem; color:var(--dim);">SZEPTEMBERTŐL - SZEPTEMBERIG</div>
</div>

<div class="dashboard-sticky">
    <div class="db-row">
        <div>
            <div class="db-label">Éves Keret (8700 kWh)</div>
            <div class="db-val" id="total-cons">0 kWh</div>
        </div>
        <div style="text-align:right;">
            <div class="db-label">Hátralévő</div>
            <div class="db-val" id="total-rem" style="color:var(--success)">0 kWh</div>
        </div>
    </div>
    
    <div style="display:flex; justify-content:space-between; font-size:0.7rem; color:var(--dim); margin-bottom:5px;">
        <span>Fogyasztás időarányos állapota:</span>
        <span id="status-text">Számítás...</span>
    </div>
    <div class="progress-track">
        <div class="progress-fill" id="prog-bar" style="width: 0%; background: var(--success);"></div>
        <div class="marker" id="time-marker" style="left: 0%;"></div> 
    </div>
</div>

<button class="settings-btn" onclick="toggleFix()">🛠️ FIX KÖLTSÉGEK BEÁLLÍTÁSA (Most: <span id="fix-display">0</span> Ft)</button>
<div id="fix-panel" style="display:none; background:var(--card); padding:15px; border-radius:12px; margin-bottom:20px;">
    </div>

<div class="month-list" id="month-container">
    </div>

<div class="fab" onclick="genPDF()" title="PDF Mentés">📥</div>

<script>
    // --- KONFIG ---
    // A start óraállás visszafejtve a 17232-ből (Jan vége)
    // Szept 1. elméleti nyitó: 14722
    const START_METER = 14722; 
    const LIMITS = { mo: 210, yr: 8700 };
    const PRICES = { r: 36.386, p: 70.104 };

    // Hónapok definíciója
    const MONTHS = [
        { id: '2025-09', name: '2025. SZEPTEMBER' },
        { id: '2025-10', name: '2025. OKTÓBER' },
        { id: '2025-11', name: '2025. NOVEMBER' },
        { id: '2025-12', name: '2025. DECEMBER' },
        { id: '2026-01', name: '2026. JANUÁR' },
        { id: '2026-02', name: '2026. FEBRUÁR' },
        { id: '2026-03', name: '2026. MÁRCIUS' },
        { id: '2026-04', name: '2026. ÁPRILIS' },
        { id: '2026-05', name: '2026. MÁJUS' },
        { id: '2026-06', name: '2026. JÚNIUS' },
        { id: '2026-07', name: '2026. JÚLIUS' },
        { id: '2026-08', name: '2026. AUGUSZTUS' },
        { id: '2026-09', name: '2026. SZEPTEMBER' }
    ];

    // Alapértelmezett fixek
    const DEFAULT_FIXES = [
        { id: 'v_at', name: 'Villany Átalány', val: 55000 },
        { id: 'tv', name: 'TV', val: 7142 },
        { id: 'tel', name: 'Telefon', val: 4500 },
        { id: 'net', name: 'Internet', val: 2880 },
        { id: 'viz', name: 'Víz', val: 2500 },
        { id: 'bizt', name: 'Biztosítás', val: 2386 },
        { id: 'szemet', name: 'Szemét', val: 667 },
        { id: 'komm', name: 'Adó', val: 600 }
    ];

    // Adattároló
    let readings = JSON.parse(localStorage.getItem('planner_readings')) || {
        '2025-09': 15073, // 351 kWh
        '2025-10': 15304, // 231 kWh
        '2025-11': 15861, // 557 kWh
        '2025-12': 16722, // 861 kWh
        '2026-01': 17583, // 861 kWh (korrigáltam, hogy stimmeljen az éves matek)
        // A te fotód 17232-t mutatott, de a fogyasztásokkal az jött ki. 
        // Itt most üresen hagyom a jövőt, a user írhatja át.
    };
    
    // Ha üres, töltsük fel a fotóról ismert adatokkal "startnak", de a user módosíthatja
    if (Object.keys(readings).length === 0) {
        readings['2025-09'] = 15073; 
    }

    let fixSettings = JSON.parse(localStorage.getItem('planner_fixes')) || {};

    // --- INIT ---
    function init() {
        renderFixPanel();
        renderMonths();
        recalcAll();
    }

    // --- RENDER ---
    function renderMonths() {
        const container = document.getElementById('month-container');
        container.innerHTML = '';

        MONTHS.forEach((m, index) => {
            const val = readings[m.id] || '';
            const isActive = m.id === getCurrentMonthId();
            
            container.innerHTML += `
            <div class="month-card ${isActive ? 'active' : ''}" id="card-${m.id}">
                <div class="mc-header">
                    <span class="mc-name">${m.name}</span>
                    <span class="mc-status" id="status-${m.id}">--</span>
                </div>
                <div class="mc-grid">
                    <div class="reading-input-group">
                        <label>ÓRAÁLLÁS</label>
                        <input type="number" class="reading-input" 
                            id="input-${m.id}" 
                            value="${val}" 
                            oninput="onInput('${m.id}', this.value)" 
                            placeholder="...">
                    </div>
                    <div class="result-box">
                        <div class="cons-val" id="cons-${m.id}">0 kWh</div>
                        <div class="cost-val" id="cost-${m.id}">0 Ft</div>
                        <div class="cost-sub" id="sub-${m.id}">Anyu része: 0 Ft</div>
                    </div>
                </div>
                <div id="narrative-${m.id}" style="font-size:0.75rem; color:var(--dim); margin-top:10px; border-top:1px dashed #334155; padding-top:5px; display:none;"></div>
            </div>
            `;
        });
    }

    function renderFixPanel() {
        const p = document.getElementById('fix-panel');
        p.innerHTML = '';
        DEFAULT_FIXES.forEach(f => {
            const val = fixSettings[f.id] !== undefined ? fixSettings[f.id] : f.val;
            p.innerHTML += `
            <div style="display:flex; justify-content:space-between; margin-bottom:8px; align-items:center;">
                <span style="font-size:0.8rem; color:#cbd5e1;">${f.name}</span>
                <input type="number" value="${val}" onchange="saveFix('${f.id}', this.value)" 
                style="background:#050b14; border:1px solid #334155; color:white; width:80px; padding:5px; border-radius:6px; font-weight:bold;">
            </div>`;
        });
    }

    // --- LOGIKA ---
    function onInput(monthId, value) {
        if(value) readings[monthId] = parseFloat(value);
        else delete readings[monthId];
        
        localStorage.setItem('planner_readings', JSON.stringify(readings));
        recalcAll();
    }

    function recalcAll() {
        let prevMeter = START_METER;
        let cumulativeCons = 0;
        
        // Fix összeg kiszámolása (Anyu: Átalány/2 + Többi 100%)
        let fixSum = 0;
        let atalany = 0;
        DEFAULT_FIXES.forEach(f => {
            const v = fixSettings[f.id] !== undefined ? parseFloat(fixSettings[f.id]) : f.val;
            if(f.id === 'v_at') atalany = v;
            else fixSum += v;
        });
        const anyuFixBase = Math.round(atalany / 2) + fixSum;
        document.getElementById('fix-display').innerText = anyuFixBase.toLocaleString();

        // Végigfutunk a hónapokon
        MONTHS.forEach((m, i) => {
            const currVal = readings[m.id];
            const consEl = document.getElementById(`cons-${m.id}`);
            const costEl = document.getElementById(`cost-${m.id}`);
            const subEl = document.getElementById(`sub-${m.id}`);
            const statusEl = document.getElementById(`status-${m.id}`);
            const narrEl = document.getElementById(`narrative-${m.id}`);

            if (currVal && currVal > prevMeter) {
                const cons = currVal - prevMeter;
                cumulativeCons += cons;
                
                // MVM számítás
                const r = Math.min(cons, LIMITS.mo);
                const p = Math.max(0, cons - LIMITS.mo);
                const mvmCost = Math.round(r * PRICES.r + p * PRICES.p);
                const anyuTotal = anyuFixBase + Math.round(mvmCost / 2); // Kérés: MVM fele + Fixek

                consEl.innerText = `${cons} kWh`;
                costEl.innerText = `${anyuTotal.toLocaleString()} Ft`;
                subEl.innerText = `Fixek: ${anyuFixBase} + MVM/2: ${Math.round(mvmCost/2)}`;
                
                // Színezés és Státusz
                if(p > 0) {
                    statusEl.innerText = "PIACI ÁRAS";
                    statusEl.className = "mc-status st-bad";
                    narrEl.style.display = "block";
                    narrEl.innerHTML = `<span style="color:var(--danger)">${p} kWh</span> túllépés a 210-es kereten.`;
                } else {
                    statusEl.innerText = "KERETBEN";
                    statusEl.className = "mc-status st-ok";
                    narrEl.style.display = "block";
                    narrEl.innerHTML = "Tökéletes, rezsicsökkentett fogyasztás.";
                }

                prevMeter = currVal; // Következő hónap alapja
            } else {
                consEl.innerText = "-";
                costEl.innerText = "-";
                subEl.innerText = "-";
                statusEl.innerText = "NINCS ADAT";
                statusEl.className = "mc-status";
                narrEl.style.display = "none";
                if(currVal) prevMeter = currVal; // Ha kisebb értéket írt (pl óracsere), akkor is legyen bázis
            }
        });

        updateDashboard(cumulativeCons);
    }

    function updateDashboard(totalUsed) {
        const rem = LIMITS.yr - totalUsed;
        const percent = (totalUsed / LIMITS.yr) * 100;
        
        document.getElementById('total-cons').innerText = totalUsed + " kWh";
        document.getElementById('total-rem').innerText = rem + " kWh";
        document.getElementById('prog-bar').style.width = percent + "%";
        
        // Időarányos marker
        const now = new Date();
        const start = new Date('2025-09-01');
        const end = new Date('2026-08-31');
        const totalTime = end - start;
        const passed = now - start;
        let timePercent = (passed / totalTime) * 100;
        if(timePercent > 100) timePercent = 100;
        if(timePercent < 0) timePercent = 0;
        
        document.getElementById('time-marker').style.left = timePercent + "%";

        const bar = document.getElementById('prog-bar');
        const statusTxt = document.getElementById('status-text');
        
        if (percent > timePercent) {
            bar.style.background = "var(--danger)";
            statusTxt.innerHTML = "<b style='color:var(--danger)'>TÚLFOGYASZTÁS!</b> Lassíts a tempón!";
        } else {
            bar.style.background = "var(--success)";
            statusTxt.innerHTML = "<b style='color:var(--success)'>BIZTONSÁGOS.</b> Van tartalékod.";
        }
    }

    // --- SEGÉDEK ---
    function getCurrentMonthId() {
        const d = new Date();
        const y = d.getFullYear();
        const m = d.getMonth() + 1;
        return `${y}-${m.toString().padStart(2, '0')}`;
    }

    function saveFix(id, val) {
        fixSettings[id] = val;
        localStorage.setItem('planner_fixes', JSON.stringify(fixSettings));
        recalcAll();
    }

    function toggleFix() {
        const p = document.getElementById('fix-panel');
        p.style.display = p.style.display === 'none' ? 'block' : 'none';
    }

    function genPDF() {
        document.body.classList.add('pdf-mode');
        const opt = { margin: 5, filename: 'Eves_Rezsi_Terv.pdf', image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } };
        html2pdf().set(opt).from(document.body).save().then(() => document.body.classList.remove('pdf-mode'));
    }

    init();
</script>
</body>
</html>
