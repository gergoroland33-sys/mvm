<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tiszta Éves Rezsi 2025-26</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
    :root {
        --bg: #0f172a; --card: #1e293b; --primary: #3b82f6; --accent: #f59e0b;
        --text: #f8fafc; --dim: #94a3b8; --border: #334155;
        --success: #10b981; --danger: #ef4444;
    }
    * { box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); margin: 0; padding: 15px; padding-bottom: 100px; }

    /* HEADER */
    .header-box { text-align: center; margin-bottom: 25px; }
    h1 { margin: 0; font-size: 1.5rem; font-weight: 900; color: white; text-transform: uppercase; letter-spacing: 1px; }
    .subtitle { color: var(--dim); font-size: 0.8rem; }

    /* DASHBOARD (STICKY) */
    .dashboard-sticky {
        position: sticky; top: 10px; z-index: 100;
        background: rgba(30, 41, 59, 0.95); backdrop-filter: blur(10px);
        border: 1px solid var(--primary); border-radius: 16px; padding: 15px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-bottom: 25px;
    }
    .db-row { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 5px; }
    .db-val { font-size: 1.4rem; font-weight: 900; color: white; }
    .db-label { font-size: 0.7rem; color: var(--dim); text-transform: uppercase; font-weight: 800; }
    
    .progress-track { height: 10px; background: #0f172a; border-radius: 5px; overflow: hidden; position: relative; margin-top: 8px; border: 1px solid var(--border); }
    .progress-fill { height: 100%; transition: width 0.5s ease; }
    .marker { position: absolute; top: 0; bottom: 0; width: 2px; background: white; z-index: 2; box-shadow: 0 0 5px white; }

    /* HÓNAP KÁRTYA */
    .month-list { display: flex; flex-direction: column; gap: 15px; }
    .month-card { 
        background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 15px; 
        transition: 0.3s; position: relative;
    }
    .month-card.active { border: 2px solid var(--primary); background: #263345; }
    
    .mc-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .mc-title { font-weight: 800; font-size: 0.9rem; color: white; text-transform: uppercase; }
    
    .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; align-items: center; }
    
    .reading-input { 
        width: 100%; background: #0f172a; border: 1px solid var(--border); color: white; 
        padding: 12px; border-radius: 8px; font-weight: 700; font-size: 1.1rem; text-align: center; outline: none;
    }
    .reading-input:focus { border-color: var(--accent); }
    
    .data-row { display: flex; justify-content: space-between; font-size: 0.8rem; margin-top: 5px; color: var(--dim); }
    .data-val { font-weight: 700; color: white; }
    .total-display { font-size: 1.2rem; font-weight: 900; color: var(--primary); text-align: right; margin-top: 5px; }

    /* FIX KÖLTSÉG GOMB */
    .fix-btn { width: 100%; background: var(--card); border: 1px solid var(--border); padding: 15px; border-radius: 12px; color: var(--dim); font-weight: 700; text-transform: uppercase; font-size: 0.8rem; margin-bottom: 20px; display: flex; justify-content: space-between; cursor: pointer; }

    /* FAB */
    .fab { position: fixed; bottom: 25px; right: 25px; width: 60px; height: 60px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 1.5rem; box-shadow: 0 10px 25px rgba(0,0,0,0.5); cursor: pointer; z-index: 999; }

    /* PDF MODE */
    .pdf-mode { background: white !important; color: black !important; padding: 20px !important; }
    .pdf-mode .dashboard-sticky, .pdf-mode .month-card, .pdf-mode .fix-btn { background: white !important; border: 1px solid #ccc !important; color: black !important; box-shadow: none !important; page-break-inside: avoid; }
    .pdf-mode input { color: black !important; background: transparent !important; border: none !important; font-weight: 900 !important; text-align: left !important; }
    .pdf-mode .fab { display: none !important; }
</style>
</head>
<body>

<div class="header-box">
    <h1>REZSI TERVEZŐ 2025/26</h1>
    <div class="subtitle">TELJES KÖLTSÉGEK (NINCS FELEZÉS)</div>
</div>

<div class="dashboard-sticky">
    <div class="db-row">
        <div>
            <div class="db-label">Éves Keret (8700 kWh)</div>
            <div class="db-val" id="d-cons">0 kWh</div>
        </div>
        <div style="text-align:right">
            <div class="db-label">Hátralévő</div>
            <div class="db-val" id="d-rem" style="color:var(--success)">0 kWh</div>
        </div>
    </div>
    <div class="progress-track">
        <div class="progress-fill" id="prog-bar" style="width:0%; background:var(--success)"></div>
        <div class="marker" id="time-marker" style="left:0%"></div>
    </div>
    <div style="text-align:center; font-size:0.7rem; color:var(--dim); margin-top:5px;" id="d-status">...</div>
</div>

<div class="fix-btn" onclick="toggleFix()">
    <span>🛠️ Havi Fix Költségek (Szerkesztés)</span>
    <span style="color:white"><span id="fix-total">0</span> Ft</span>
</div>
<div id="fix-panel" style="display:none; background:var(--card); padding:15px; border-radius:12px; margin-bottom:20px; border:1px solid var(--border);">
    </div>

<div class="month-list" id="month-list"></div>

<div class="fab" onclick="genPDF()" title="PDF Mentés">📥</div>

<script>
    // --- KONFIGURÁCIÓ ---
    // Kezdőpont: 2025. Szeptember 1.
    // Visszafejtve a 17232-es Januári záróból: 14371
    const START_METER = 14371; 
    const LIMITS = { mo: 210, yr: 8700 };
    const PRICES = { r: 36.386, p: 70.104 }; // Pontos MVM árak

    const MONTHS = [
        { id: '2025-09', name: '2025. SZEPTEMBER' },
        { id: '2025-10', name: '2025. OKTÓBER' },
        { id: '2025-11', name: '2025. NOVEMBER' },
        { id: '2025-12', name: '2025. DECEMBER' },
        { id: '2026-01', name: '2026. JANUÁR' },
        { id: '2026-02', name: '2026. FEBRUÁR' },
        { id: '2026-03', name: '2026. MÁRCIUS' },
        { id: '2026-04', name: '2026. ÁPRILIS' },
        { id: '2026-05', name: '2026. MÁJUS' },
        { id: '2026-06', name: '2026. JÚNIUS' },
        { id: '2026-07', name: '2026. JÚLIUS' },
        { id: '2026-08', name: '2026. AUGUSZTUS' },
        { id: '2026-09', name: '2026. SZEPTEMBER' }
    ];

    // FIX KÖLTSÉGEK (100% ÁR)
    const DEFAULT_FIXES = [
        { id: 'tv', name: 'TV', val: 7142 },
        { id: 'tel', name: 'Telefon', val: 4500 },
        { id: 'net', name: 'Internet', val: 2880 },
        { id: 'viz', name: 'Víz', val: 2500 },
        { id: 'bizt', name: 'Biztosítás', val: 2386 },
        { id: 'szemet', name: 'Szemét', val: 667 },
        { id: 'komm', name: 'Adó', val: 600 }
        // Villany átalányt nem teszünk ide, mert az MVM-et számoljuk pontosan
    ];

    // ADATOK
    let readings = JSON.parse(localStorage.getItem('pure_readings')) || {
        '2025-09': 14722, // 351 kWh
        '2025-10': 14953, // 231 kWh
        '2025-11': 15510, // 557 kWh
        '2025-12': 16371, // 861 kWh
        '2026-01': 17232  // 861 kWh (A fotón ez a mentett!)
    };
    
    let fixValues = JSON.parse(localStorage.getItem('pure_fixes')) || {};

    // --- RENDER ---
    function init() {
        renderFixes();
        renderList();
        calcAll();
    }

    function renderFixes() {
        const p = document.getElementById('fix-panel');
        p.innerHTML = '';
        DEFAULT_FIXES.forEach(f => {
            const val = fixValues[f.id] !== undefined ? fixValues[f.id] : f.val;
            p.innerHTML += `
            <div style="display:flex; justify-content:space-between; margin-bottom:10px; align-items:center;">
                <span style="font-size:0.8rem; color:#cbd5e1;">${f.name}</span>
                <input type="number" value="${val}" onchange="saveFix('${f.id}', this.value)" 
                style="background:#0f172a; border:1px solid #334155; color:white; width:90px; padding:8px; border-radius:8px; font-weight:bold; text-align:right;">
            </div>`;
        });
    }

    function renderList() {
        const c = document.getElementById('month-list');
        c.innerHTML = '';
        const nowId = getNowId();

        MONTHS.forEach(m => {
            const val = readings[m.id] || '';
            const activeClass = m.id === nowId ? 'active' : '';
            
            c.innerHTML += `
            <div class="month-card ${activeClass}" id="card-${m.id}">
                <div class="mc-top">
                    <span class="mc-title">${m.name}</span>
                    <span style="font-size:0.7rem; color:var(--dim);">Nyitó: <span id="start-${m.id}">...</span></span>
                </div>
                <div class="input-grid">
                    <div>
                        <input type="number" class="reading-input" placeholder="Záró állás" 
                            value="${val}" oninput="saveReading('${m.id}', this.value)">
                    </div>
                    <div style="text-align:right;">
                        <div class="total-display" id="cost-${m.id}">0 Ft</div>
                        <div style="font-size:0.7rem; color:var(--dim);">Fogyasztás: <span id="cons-${m.id}" style="color:white; font-weight:700;">0</span> kWh</div>
                    </div>
                </div>
                <div id="info-${m.id}" style="font-size:0.7rem; margin-top:8px; padding-top:5px; border-top:1px dashed #334155; color:#94a3b8;"></div>
            </div>`;
        });
        
        // Scroll
        setTimeout(() => {
            const act = document.querySelector('.month-card.active');
            if(act) act.scrollIntoView({behavior:"smooth", block:"center"});
        }, 300);
    }

    // --- LOGIKA ---
    function calcAll() {
        // Fixek összegzése (100%)
        let fixSum = 0;
        DEFAULT_FIXES.forEach(f => {
            fixSum += (fixValues[f.id] !== undefined ? fixValues[f.id] : f.val);
        });
        document.getElementById('fix-total').innerText = fixSum.toLocaleString();

        // Hónapok láncolása
        let prev = START_METER;
        let yearlyTotal = 0;

        MONTHS.forEach(m => {
            document.getElementById(`start-${m.id}`).innerText = prev;
            const curr = readings[m.id];
            
            const costEl = document.getElementById(`cost-${m.id}`);
            const consEl = document.getElementById(`cons-${m.id}`);
            const infoEl = document.getElementById(`info-${m.id}`);

            if(curr && curr > prev) {
                const cons = curr - prev;
                yearlyTotal += cons;

                // Tiszta MVM számítás
                const r = Math.min(cons, LIMITS.mo);
                const p = Math.max(0, cons - LIMITS.mo);
                const mvmCost = Math.round((r * PRICES.r) + (p * PRICES.p));
                
                // VÉGLEGES TISZTA FIZETENDŐ: MVM(100%) + FIX(100%)
                const finalTotal = mvmCost + fixSum;

                consEl.innerText = cons;
                costEl.innerText = finalTotal.toLocaleString() + " Ft";
                
                let infoText = `MVM: ${mvmCost.toLocaleString()} Ft + Fix: ${fixSum.toLocaleString()} Ft.`;
                if(p > 0) infoText += ` <span style="color:var(--danger)">⚠️ ${p} kWh piaci áras!</span>`;
                else infoText += ` <span style="color:var(--success)">✔️ Kereten belül.</span>`;
                
                infoEl.innerHTML = infoText;
                
                prev = curr; // Láncoljuk a következőhöz
            } else {
                consEl.innerText = "-";
                costEl.innerText = "-";
                infoEl.innerHTML = "Adatbevitelre vár...";
                if(curr) prev = curr; // Ha kisebb az adat, akkor is ez legyen a kövi alapja
            }
        });

        updateDashboard(yearlyTotal);
    }

    function updateDashboard(total) {
        const rem = LIMITS.yr - total;
        const pct = (total / LIMITS.yr) * 100;
        
        document.getElementById('d-cons').innerText = total + " kWh";
        document.getElementById('d-rem').innerText = rem + " kWh";
        document.getElementById('prog-bar').style.width = pct + "%";
        
        // Idővonal
        const start = new Date('2025-09-01');
        const end = new Date('2026-08-31');
        const now = new Date();
        const totalTime = end - start;
        const passed = now - start;
        let timePct = (passed / totalTime) * 100;
        if(timePct > 100) timePct = 100;
        
        document.getElementById('time-marker').style.left = timePct + "%";
        
        const statusEl = document.getElementById('d-status');
        const bar = document.getElementById('prog-bar');
        
        if(pct > timePct) {
            bar.style.background = "var(--danger)";
            statusEl.innerHTML = "<span style='color:var(--danger)'>TÚLFOGYASZTÁS!</span> A csík megelőzte az időt.";
        } else {
            bar.style.background = "var(--success)";
            statusEl.innerHTML = "<span style='color:var(--success)'>RENDBEN.</span> Van tartalékod.";
        }
    }

    // --- ESZKÖZÖK ---
    function saveReading(id, val) {
        if(val) readings[id] = parseFloat(val);
        else delete readings[id];
        localStorage.setItem('pure_readings', JSON.stringify(readings));
        calcAll();
    }

    function saveFix(id, val) {
        fixValues[id] = parseFloat(val);
        localStorage.setItem('pure_fixes', JSON.stringify(fixValues));
        calcAll();
    }

    function toggleFix() {
        const p = document.getElementById('fix-panel');
        p.style.display = p.style.display === 'none' ? 'block' : 'none';
    }

    function getNowId() {
        const d = new Date();
        return `${d.getFullYear()}-${(d.getMonth()+1).toString().padStart(2,'0')}`;
    }

    function genPDF() {
        document.body.classList.add('pdf-mode');
        const opt = { margin: 5, filename: 'Tiszta_Rezsi.pdf', image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } };
        html2pdf().set(opt).from(document.body).save().then(() => document.body.classList.remove('pdf-mode'));
    }

    init();
</script>
</body>
</html>
